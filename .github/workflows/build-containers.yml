name: Build and Push Containers

# This workflow builds and pushes container images to GHCR
# GITHUB_TOKEN is automatically provided for GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
  # No paths filter: change detection happens in the prepare job, and the
  # all-green aggregate must report on every PR to serve as a required check.
  pull_request:
    branches:
      - main

  schedule:
    # Refresh repository-managed RPMs independently of base-image releases.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      app:
        description: "Space-separated app names, or * for all apps"
        required: true
        default: "*"
        type: string

# Keep only the current PR build; publish and scheduled runs finish normally.
concurrency:
  group: build-containers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Detect which app directories have changed
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: changed-files
        with:
          path: apps
          include_only_directories: true
          max_depth: 1

      - name: Dump GitHub context
        run: echo "$GITHUB_CONTEXT"

  changed:
    if: ${{ needs.prepare.outputs.changed-files != '[]' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    name: Get Changed Apps
    needs:
      - prepare
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get Apps
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: apps
        env:
          APPS: ${{ github.event_name == 'schedule' && '*' || github.event_name == 'workflow_dispatch' && inputs.app || join(fromJSON(needs.prepare.outputs.changed-files), ' ') }}
        with:
          script: |-
            const fs = require('fs');
            const { APPS } = process.env;
            const available = fs.readdirSync('apps').filter(app => fs.existsSync(`apps/${app}/Containerfile`));
            const { selectApps } = require('./.github/select-build-apps.cjs');
            const appsToBuild = selectApps(available, APPS, context.eventName === 'workflow_dispatch');
            core.setOutput('apps', JSON.stringify(appsToBuild));
            console.log('apps:', JSON.stringify(appsToBuild, null, 2));
            core.summary.addHeading('Apps to build:').addList(appsToBuild).write();


  # Build and push containers for changed apps
  build:
    needs: changed
    if: ${{ needs.changed.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        app: ${{ fromJson(needs.changed.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Apps that can't build for all default platforms declare their own in
      # an apps/<app>/PLATFORMS file (e.g. zfs-exporter: OpenZFS publishes no
      # aarch64 EL packages)
      - name: Determine platforms
        id: platforms
        run: |
          if [ -f "apps/${{ matrix.app }}/PLATFORMS" ]; then
            echo "platforms=$(cat "apps/${{ matrix.app }}/PLATFORMS")" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=${{ env.PLATFORMS }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY.MM.DD' tz='America/New_York'}},enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: ${{ !env.ACT }}
        with:
          provenance: false
          no-cache: ${{ github.event_name == 'schedule' }}
          context: ./apps/${{ matrix.app }}
          file: ./apps/${{ matrix.app }}/Containerfile
          push: ${{ (github.event_name == 'push' || github.event_name == 'schedule') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ steps.platforms.outputs.platforms }}

      - name: Attest build provenance
        if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export built image for SBOM generation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./apps/${{ matrix.app }}
          file: ./apps/${{ matrix.app }}/Containerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.app }}.tar
          provenance: false
          # Reuse this job's cache, including the fresh scheduled build.
          push: false

      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # renovate: datasource=github-releases depName=anchore/syft
          syft-version: v1.54.0

      - name: Generate per-platform image SBOMs
        env:
          APP: ${{ matrix.app }}
          IMAGE_PLATFORMS: ${{ steps.platforms.outputs.platforms }}
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p "${RUNNER_TEMP}/${APP}-sbom"
          IFS=',' read -ra image_platforms <<< "$IMAGE_PLATFORMS"
          for platform in "${image_platforms[@]}"; do
            arch="${platform#linux/}"
            "$SYFT_CMD" scan "oci-archive:${RUNNER_TEMP}/${APP}.tar" --platform "$platform" \
              --source-name "${APP}-${arch}" \
              -o "github-json=${RUNNER_TEMP}/${APP}-sbom/${arch}.github.json" \
              -o "spdx-json=${RUNNER_TEMP}/${APP}-sbom/${arch}.spdx.json"
          done

      - name: Upload image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.app }}-sbom
          path: ${{ runner.temp }}/${{ matrix.app }}-sbom/
          if-no-files-found: error

      - name: Output image details
        run: |
          echo "Built and pushed images for app: ${{ matrix.app }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  dependency-pins-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test .github/tests/*.test.cjs

  # Aggregate result that reports on every PR, including ones where build is
  # skipped — this is the branch ruleset's required check.
  all-green:
    name: all-green
    if: ${{ always() }}
    needs:
      - prepare
      - changed
      - build
      - dependency-pins-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A dependency job failed or was cancelled"
            exit 1
          fi
          echo "All jobs succeeded or were skipped"
