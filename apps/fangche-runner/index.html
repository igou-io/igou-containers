<!DOCTYPE html>
<html lang="en">
<head>

<title>房车 RUNNER</title>
<style>
  :root{ --bg:#0b0e14; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:var(--bg); overflow:hidden; }
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    color:#e8eef7;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #wrap{ position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  canvas#game{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#0b0e14;
    box-shadow:0 0 0 2px #223, 0 24px 80px rgba(0,0,0,.7);

    user-select:none; -webkit-user-select:none;

  }
  .tbtn:active{ background:rgba(60,110,180,.6); }
  #dpad{ left:16px; bottom:18px; width:150px; height:150px; }
  #tp-left{ left:0; bottom:34px; width:56px; height:56px; }
  #tp-right{ right:0; bottom:34px; width:56px; height:56px; }
  #tp-down{ left:47px; bottom:0; width:56px; height:56px; }
  #tjump{ right:20px; bottom:60px; width:76px; height:76px; background:rgba(120,80,20,.5); border-color:rgba(255,200,120,.5); }
  #twrench{ right:104px; bottom:20px; width:64px; height:64px; background:rgba(20,60,120,.5); }
  #trun{ right:20px; bottom:150px; width:56px; height:56px; background:rgba(20,80,60,.5); border-color:rgba(120,255,200,.4); }

<body>

<script>
"use strict";
/* =========================================================================
   房车 RUNNER — single-file 2D platformer
   Sections:
     CONFIG / CONSTANTS
     AUDIO (staged)
     INPUT (keyboard + touch)
     CAMERA
     LEVEL FORMAT & TILES
     PHYSICS / PLAYER
     ENTITY SYSTEM (staged)
     LEVELS DATA (staged)
     RENDER
     SCREENS / HUD (staged)
     GAME STATE & MAIN LOOP
   ========================================================================= */

// ===== SECTION: CONFIG =============================================
const TILE = 16;
const VIEW_W = 512, VIEW_H = 288;
const SCREEN_TILES_W = VIEW_W / TILE;   // 32
const SCREEN_TILES_H = VIEW_H / TILE;   // 18

// Physics tuned to targets: full jump ~4.5 tiles up, ~6 tiles far at run.
const GRAVITY      = 0.55;
const JUMP_V       = 9.05;   // -> apex ~70px (~4.4 tiles discrete; ~4.5 with hang)
const JUMP_CUT     = 0.42;   // variable-jump velocity cap on early release
const WALK_SPEED   = 1.55;
const RUN_SPEED    = 3.05;
const ACCEL        = 0.30;
const SKID_ACCEL   = 0.55;   // quick turnaround
const FRICTION     = 0.22;
const AIR_ACCEL    = 0.28;
const AIR_FRICTION = 0.04;
const MAX_FALL     = 9.5;
const COYOTE_FRAMES = 5;     // ~90ms at 60fps
const JUMPBUF_FRAMES= 8;     // ~120-130ms at 60fps (press survives landing)
const CROUCH_H     = 8;
const STOMP_BOUNCE = 5.2;
const BOUNCE_PAD_V = 11.5;
const SWING_FRAMES = 10;     // wrench swing active window (impact driver halves it)
const ARC_COST     = 18;     // anode-meter cost per arc-flash
const ARC_SPEED    = 4.6;
const ARC_GRAV     = 0.22;   // gentle Mario-fireball arc
const SLIDE_SPEED  = 4.7;

const CJK_FONT = "8px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif";
const CJK_FONT_L = "10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif";
const PIX_FONT = "8px monospace";

// ===== SECTION: AUDIO — synthesized chiptune + SFX (Web Audio, original melodies)
const _NOTE_SEMI = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function noteHz(n){ const m=/^([A-G][#b]?)(\d)$/.exec(n); if(!m) return 0; return 440*Math.pow(2,((+m[2]-4)*12 + _NOTE_SEMI[m[1]] - 9)/12); }

// Seven original zone themes (pentatonic/mode based, no copyrighted material).
// lead+bass are 1-bar 16th-note lines; numeric 0 = rest (chiptune square/triangle).
const SONGS = {
 1:{ b:138, lw:'square',lv:0.12, bw:'triangle',bv:0.20, hat:false,
    lead:['A4',0,'C#5',0,'E5',0,'C#5','A4','B4','C#5','E5',0,'F#5',0,'E5','C#5'],
    bass:['A2','A3','A2','A3','A2','A3','A2','A3','F#2','F#3','F#2','F#3','E2','E3','E2','E3']},
 2:{ b:126, lw:'square',lv:0.12, bw:'triangle',bv:0.20, hat:false,
    lead:['G4',0,'D4',0,'B4',0,'G4','E4','G4',0,'B4',0,'D5',0,'B4','D4'],
    bass:['E2','E3','E2','E3','B2','B3','B2','B3','G2','G3','G2','G3','A2','A3','A2','A3']},
 3:{ b:132, lw:'square',lv:0.12, bw:'sawtooth',bv:0.15, hat:false,
    lead:['D4',0,'F4','D4','E4',0,'D4','Bb3','C4',0,'E4',0,'C5',0,'Bb4','A4'],
    bass:['D2','D3','D2','D3','D2','D3','D2','D3','C2','C3','C2','C3','Bb2','Bb3','Bb2','Bb3']},
 4:{ b:146, lw:'square',lv:0.11, bw:'triangle',bv:0.19, hat:false,
    lead:['C5',0,'F4',0,'F4','G4','A4','B4','C5',0,'B4','A4','G4',0,'F4','D4'],
    bass:['F2','F3','F2','F3','F2','F3','F2','F3','C2','C3','C2','C3','D2','D3','D2','D3']},
 5:{ b:118, lw:'triangle',lv:0.15, bw:'sine',bv:0.24, hat:false,
    lead:['B4',0,0,'G4',0,0,'D5',0,'E5',0,0,'D5','B4',0,'G4',0],
    bass:['G2',0,'G3',0,'G2',0,'G3',0,'D2',0,'D3',0,'D2',0,'D3',0]},
 6:{ b:150, lw:'square',lv:0.12, bw:'sawtooth',bv:0.17, hat:true,
    lead:['C5',0,0,0,'Bb4','F4',0,0,'Eb4',0,'G4',0,'C5',0,0,0],
    bass:['C2','C3','C2','C3','Bb2','Bb3','Bb2','Bb3','G2','G3','G2','G3','Bb2','Bb3','Bb2','Bb3']},
 7:{ b:166, lw:'square',lv:0.12, bw:'sawtooth',bv:0.18, hat:true,
    lead:['A4',0,'C5','A4','E5','C5','A4','G4','A4',0,'C5',0,'E5',0,0,0],
    bass:['A2','A3','A2','A3','A2','A3','A2','A3','F2','F3','F2','F3','G2','G3','G2','G3']},
};

const AudioEngine = {
  ready:false, muted:false, master:null, ctx:null,
  _song:null, _step:0, _next:0, _timer:null,
  init(){
    if(this.ready) return;
    const AC = (typeof window!=='undefined') && (window.AudioContext||window.webkitAudioContext);
    if(!AC){ this.ready=false; return; }   // headless (no AudioContext): stay silent, no crash
    try{
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted?0:0.85;
      this.master.connect(this.ctx.destination);
      if(this.ctx.state==='suspended') this.ctx.resume();
      this.ready = true;
    }catch(e){ this.ready=false; }
  },
  _t(){ return this.ctx? this.ctx.currentTime : 0; },
  _tone(freq,type,t0,dur,vol){
    if(!this.ctx||freq<=0) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+0.03);
  },
  _slide(f0,f1,type,t0,dur,vol){
    if(!this.ctx) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(Math.max(20,f0),t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+0.03);
  },
  _noise(t0,dur,vol,band){
    if(!this.ctx) return;
    const n=Math.max(1,(this.ctx.sampleRate*dur)|0);
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const fl=this.ctx.createBiquadFilter(); fl.type= band? 'bandpass':'lowpass'; fl.frequency.value=band||800; fl.Q.value=0.8;
    const g=this.ctx.createGain(); g.gain.value=vol;
    src.connect(fl); fl.connect(g); g.connect(this.master);
    src.start(t0);
  },
  _hat(t0){ this._noise(t0,0.03,0.05,8000); },
  sfx(name){ if(!this.ready) return; const fn=SFX[name]; if(fn) fn(this,this._t()); },
  music(zone){
    this.stopMusic();
    if(!this.ready) return;
    const s=SONGS[zone]||SONGS[1];
    this._song=s; this._step=0; this._next=this._t()+0.08;
    const step=60/s.b/4, dur=step*0.92;
    const tick=()=>{
      const sg=this._song;
      if(!sg || !this.ready){ this._timer=null; return; }
      const hor=this._t()+0.16;
      while(this._next<hor){
        const i=this._step, t=this._next;
        const L=sg.lead[i]; if(L) this._tone(noteHz(L),sg.lw,t,dur,sg.lv);
        const B=sg.bass[i]; if(B) this._tone(noteHz(B),sg.bw,t,dur,sg.bv);
        if(sg.hat && i%4===2) this._hat(t);
        this._step=(i+1)%sg.lead.length;
        this._next+=step;
      }
      this._timer=setTimeout(tick,50);
    };
    this._timer=setTimeout(tick,50);
  },
  stopMusic(){ if(this._timer){ clearTimeout(this._timer); this._timer=null; } this._song=null; },
  setMute(m){ this.muted=!!m; if(this.master) this.master.gain.value = this.muted?0:0.85; }
};

// SFX: name -> play(engine, nowTime). All synthesized, tuned for a 2D platformer.

// ===== SECTION: INPUT =============================================
const Input = {
  keys:{},
  // logical states
  left:false,right:false,up:false,down:false,
  jump:false,jumpPrev:false,
  wrench:false,wrenchPrev:false,
  run:false, action:false,
  jumpBuffered:false,
  isTouch:false,
  init(){
    window.addEventListener('keydown', e=>this.onKey(e,true));
    window.addEventListener('keyup', e=>this.onKey(e,false));
    // touch detection
    this.isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints>0);
    if(this.isTouch) wireTouch();
    // prevent page scroll on arrows/space
    window.addEventListener('keydown', e=>{
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    });
  },
  mapKey(code){
    switch(code){
      case 'ArrowLeft': case 'KeyA': return 'left';
      case 'ArrowRight': case 'KeyD': return 'right';
      case 'ArrowUp': case 'KeyW': return 'up';
      case 'ArrowDown': case 'KeyS': return 'down';
      case 'Space': case 'KeyZ': return 'jump';
      case 'KeyX': case 'KeyJ': return 'wrench';
      case 'ShiftLeft': case 'ShiftRight': case 'ControlLeft': return 'run';
      case 'Enter': return 'pause';
      case 'KeyM': return 'mute';
    }
    return null;
  },
  onKey(e,down){
    const k=this.mapKey(e.code);
    if(!k) return;
    this.keys[k]=down;
    if(k==='left') this.left=down;
    if(k==='right') this.right=down;
    if(k==='up') this.up=down;
    if(k==='down') this.down=down;
    if(k==='jump'){ if(down) this.jumpBuffered=true; this.jump=down; }
    if(k==='wrench') this.wrench=down;
    if(k==='run') this.run=down;
      if(k==='pause' && down) onPauseToggle();
      if(k==='mute' && down) AudioEngine.setMute(!AudioEngine.muted);
  },
  // called by touch handlers
  setTouchState(obj){
    if(obj.left) this.left=true;
    if(obj.right) this.right=true;
    if(obj.down) this.down=true;
    if(obj.run) this.run=true;
    if(obj.jump){ if(!this.jump) this.jumpBuffered=true; this.jump=true; }
    if(obj.wrench) this.wrench=true;
  },
  endTouchState(obj){
    if(obj.left) this.left=false;
    if(obj.right) this.right=false;
    if(obj.down) this.down=false;
    if(obj.run) this.run=false;
    if(obj.jump) this.jump=false;
    if(obj.wrench) this.wrench=false;
  },
  update(){
    // edge detect jump / wrench for one-shot consumers
    this.jumpJustPressed = this.jumpBuffered;
    this.jumpBuffered = false;
    this.wrenchJustPressed = this.wrench && !this.wrenchPrev;
    this.wrenchPrev = this.wrench;
  },
  consumeJumpBuffer(){ this.jumpBuffered=false; }
};
function wireTouch(){
  document.getElementById('touch').style.display='block';
  const bind=(id,key)=>{
    const el=document.getElementById(id);
    const on=(e)=>{e.preventDefault(); Input.setTouchState({[key]:true});};
    const off=(e)=>{e.preventDefault(); Input.endTouchState({[key]:false});};
    el.addEventListener('touchstart',on,{passive:false});
    el.addEventListener('touchend',off,{passive:false});
    el.addEventListener('touchcancel',off,{passive:false});
  };
  bind('tp-left','left'); bind('tp-right','right'); bind('tp-down','down');
  bind('tjump','jump'); bind('twrench','wrench'); bind('trun','run');
}

// ===== SECTION: CAMERA ===========================================
const Camera = {
  x:0, y:0,
  lookAhead:0,
  deadW:64, deadH:24,
  update(px,py,pw,ph,levelW,levelH){
    const targetX = px + pw/2 - VIEW_W/2 + this.lookAhead;
    const targetY = py + ph/2 - VIEW_H/2;
    // horizontal soft follow with dead-zone
    let dx = targetX - this.x;
    if(Math.abs(dx) > this.deadW*0.5) this.x += dx*0.12;
    else this.x += dx*0.06;
    // look-ahead easing
    const la = (Game.player?Game.player.facing:1) * 26;
    this.lookAhead += (la - this.lookAhead)*0.08;
    this.x = Math.max(0, Math.min(levelW - VIEW_W, this.x));
    this.y = Math.max(0, Math.min(levelH - VIEW_H, targetY));
    this.y = Math.round(this.y); this.x = Math.round(this.x - this.lookAhead);
  }
};

// ===== SECTION: LEVEL FORMAT & TILES ===========================
// Tile legend (single char per cell)
//  ' ' empty   '#' solid block    'B' brick/wood block  '?' storage bay hatch
//  '^' oneway platform (awning)  '=' oneway solid top   'A' bounce pad (table)
//  'R' ramp (launch)             '~' water (decor/zone1)  '.' decorative
// Stage 4 hazards: 'W' wiring bridge (solid, chewed by mice / wrenchable)
//  'o' window (wrench opens it, vents gas clouds)  'V' open vent (drips goblins)
//  'v' capped vent   'H' HV orange line (breaker-trip, zone 3+)
//  'h' water heater (thaws freeze wraith)   'Q' frozen-brittle platform (1 step)
// Stage 5 zone gimmicks:
//  'S' rooftop solar array (one-way, slides you along the roof line)
//  'G' EV charge-pad floor (solid; recharges arc meter, builds regen dash)
//  'C' charging cable vine (climb with Up while overlapping)
//  'U' hot-pot steam updraft (boosts jump height in its column)
//  'L' lantern rope (holdable glide line in gusty night-market air)
//  'q' QR toll-gate door (solid; scan from close with X to open the run)
//  'K' sea-freight parts crate (solid; wrench it for imported parts)
// Legend is per-level palette-able.
const Tile = { SOLID:'#BXWQGqK', ONEWAY:'^=S', BOUNCE:'A' };
function makeLevel(def){
  const rows = def.map;
  const h = rows.length, w = Math.max(...rows.map(r=>r.length));
  const grid = [];
  for(let y=0;y<h;y++){
    const line = rows[y];
    let row=[];
    for(let x=0;x<w;x++){
      const ch = x < line.length ? line[x] : ' ';
      row.push(ch);
    }
    grid.push(row);
  }
  return {
    id:def.id, zone:def.zone, name:def.name, label:def.label,
    w, h, grid,
    spawn:def.spawn, flag:def.flag,
    palette:def.palette, music:def.music,
    entities: def.entities||[],
    widthPx:w*TILE, heightPx:h*TILE,
    auto:!!def.auto, solarDir:def.solarDir, gust:!!def.gust, snowY:def.snowY,
    bg:def.bg,
    // runtime
    items:[], enemies:[], particles:[], projectiles:[], floats:[], npcs:[], gadgets:[],
    flagsOpen:{},
    dumpRoom:null,
    boss:null,
    cleared:false, clearedAt:0
  };
}
function tlChar(level,x,y){
  if(x<0||y<0||x>=level.w||y>=level.h) return (y>=level.h)?'#':' ';
  return level.grid[y][x];
}
function isSolid(level,x,y){ const c=tlChar(level,x,y); return c==='#'||c==='B'||c==='?'||c==='R'||c==='W'||c==='Q'||c==='G'||c==='q'||c==='K'; }
function isOneWay(level,x,y){ const c=tlChar(level,x,y); return c==='^'||c==='='||c==='S'; }
function isBounce(level,x,y){ return tlChar(level,x,y)==='A'; }

// ===== SECTION: PHYSICS / PLAYER ============================
const Game = {
  state:'boot', // boot/title/map/play/paused/done/over/clear/death
  level:null, levelIndex:0,
  player:null,
  lives:3, anodes:0, power:0, // 0 apprentice,1 16A,2 32A
  arcMeter:0, arcMax:100,
  multiplier:1,
  timer:0, timerMax:300,
  servicesFound:[],
  zoneLevels:{},
  shake:0, flash:0,
  timeScale:1,
};
function newPlayer(px,py){
  return {
    x:px, y:py, w:10, h:14,
    vx:0, vy:0,
    facing:1,
    onGround:false,
    coyote:0, jumpBuf:0,
    crouch:false,
    invuln:0, surge:0, shield:false, impact:0, slide:0, slideT:0, tripCd:0,
    seal:0,
    swing:0, swung:false,
    dead:false, deathT:0,
    checkpoint:null,
    animT:0
  };
}
function solidAt(level,rect){
  const x0=Math.floor(rect.x/TILE), y0=Math.floor(rect.y/TILE);
  const x1=Math.floor((rect.x+rect.w-0.01)/TILE), y1=Math.floor((rect.y+rect.h-0.01)/TILE);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(isSolid(level,tx,ty)) return {tx,ty};
  }
  return null;
}
function moveAndCollide(level,p,dt){
  // Horizontal
  const prevY=p.y;
  p.x += p.vx;
  let r={x:p.x,y:p.y,w:p.w,h:p.h};
  let hit=solidAt(level,r);
  if(hit){
    if(p.vx>0) p.x = hit.tx*TILE - p.w - 0.01;
    else if(p.vx<0) p.x = (hit.tx+1)*TILE + 0.01;
    p.vx=0;
    r={x:p.x,y:p.y,w:p.w,h:p.h};
  }
  // Vertical
  p.y += p.vy;
  r={x:p.x,y:p.y,w:p.w,h:p.h};
  p.onGround=false;
  let vhit=solidAt(level,r);
  if(vhit){
    if(p.vy>0){
      p.y = vhit.ty*TILE - p.h - 0.01;
      p.vy=0; p.onGround=true;
    } else if(p.vy<0){
      p.y = (vhit.ty+1)*TILE + 0.01;
      p.vy=0;
      onHeadBump(level, p, vhit.ty);
    }
  }
  // One-way platforms: only when falling and feet were above the top
  if(p.vy>=0){
    const feetPrev = prevY + p.h;
    const feetNow = p.y + p.h;
    const tx0=Math.floor((p.x+1)/TILE), tx1=Math.floor((p.x+p.w-1)/TILE);
    const ty=Math.floor(feetNow/TILE);
    for(let tx=tx0;tx<=tx1;tx++){
      if(isOneWay(level,tx,ty)){
        const top=ty*TILE;
        if(feetPrev<=top+1 && feetNow>=top){
          p.y = top - p.h - 0.01; p.vy=0; p.onGround=true;
        }
      }
    }
    // Bounce pads
    for(let tx=tx0;tx<=tx1;tx++){
      if(isBounce(level,tx,ty)){
        const top=ty*TILE;
        if(feetPrev<=top+2 && feetNow>=top){
          p.y=top-p.h-0.01; p.vy=-BOUNCE_PAD_V;
          AudioEngine.sfx('bounce');
        }
      }
    }
  }
  return;
}
function onHeadBump(level,p,ty){
  // hit a block from below: storage bay hatches dispense items
  const tx0=Math.floor((p.x+2)/TILE), tx1=Math.floor((p.x+p.w-2)/TILE);
  for(let tx=tx0;tx<=tx1;tx++){
    if(level.grid[ty] && level.grid[ty][tx]==='?'){
      spawnFromHatch(level,tx,ty);
    }
  }
}
function spawnFromHatch(level,tx,ty){
  if(!Game.hatchState) Game.hatchState={};
  const key=Game.levelIndex+':'+tx+','+ty;
  if(!Game.hatchState[key]){
    Game.hatchState[key]=true;
    const roll=Math.random();
    const bx=tx*TILE+8, by=ty*TILE-20;
    const pop=(t,x,y)=>{ const it=makeItem(t,x,y); it.vy=-3.2; level.items.push(it); };
    if(roll<0.55){ pop('anode',bx-14,by); pop('anode',bx-7,by-6); pop('anode',bx,by-9); pop('anode',bx+7,by-6); }
    else if(roll<0.75){ pop(Math.random()<0.5?'sealant':'torque', bx-6, by); }
    else if(roll<0.85){ pop('mooncake', bx-6, by); }
    else if(roll<0.92){ spawnMouseFn(level,tx,ty); }
    else { spawnParticles(bx, by+16, 8, '#d8c8a0', {up:2}); spawnFloatFx('?', bx, by, '#fff'); }
    AudioEngine.sfx('hatch');
  }
}
function updatePlayer(p,level,dt){
  if(p.dead){
    p.deathT+=dt;
    p.vy += GRAVITY; p.y += p.vy;
    return;
  }
  const run = Input.run || Input.isTouch; // touch defaults to run speed
  const target = (Input.left? -1:0) + (Input.right? 1:0);
  // high-altitude thin air (Z6): above the snow line the legs feel heavier
  // and the arc meter slowly bleeds out until a thermos of strong tea
  const cold = level.snowY!==undefined && (p.y+p.h)<level.snowY && (p.coldImmune||0)<=0 && !p.dead;
  if(cold && Game.arcMeter>0){
    Game.arcMeter=Math.max(0,Game.arcMeter-0.1);
    if((p.animT|0)%24===0) spawnParticles(p.x+p.w/2, p.y, 1, '#cfe8ff', {up:-0.6});
  }
  const maxSp = (run? RUN_SPEED : WALK_SPEED) * (cold? 0.88 : 1);
  // crouch (or sliding low with bearing grease)
  const wantCrouch = (Input.down && p.onGround) || p.slideT>0;
  p.crouch = wantCrouch;
  const useH = p.crouch? CROUCH_H : (Game.power>0? 14:14);
  if(p.crouch && p.h!==CROUCH_H){ p.y += (p.h-CROUCH_H); p.h=CROUCH_H; }
  else if(!p.crouch && p.h!==14){
    const sy = p.y - (14-p.h);
    if(!solidAt(level,{x:p.x,y:sy,w:p.w,h:14})){ p.y=sy; p.h=14; } else { p.crouch=true; }
  }

  // --- surface under the feet (solar slide / EV charge pad) ---
  let footChar=' ';
  if(p.onGround){
    const fx=Math.floor((p.x+p.w/2)/TILE), fy=Math.floor((p.y+p.h+2)/TILE);
    footChar=tlChar(level,fx,fy);
    if(footChar==='G'){
      Game.regen=Math.min(100,(Game.regen||0)+1.1);
      if(Game.power>0) Game.arcMeter=Math.min(Game.arcMax,Game.arcMeter+0.35);
      if((p.animT|0)%5===0) spawnParticles(p.x+p.w/2, p.y+p.h, 1, '#6cf', {up:0.8});
    }
  }

  // horizontal accel with skid
  let acc = p.onGround? ACCEL : AIR_ACCEL;
  if(p.onGround && p.vx!==0 && target!==0 && Math.sign(p.vx)!==target){ acc = SKID_ACCEL; }
  if(target!==0){
    p.vx += acc*target;
    p.facing = target;
  } else {
    const fr = p.onGround? FRICTION : AIR_FRICTION;
    if(p.vx>0) p.vx=Math.max(0,p.vx-fr);
    else if(p.vx<0) p.vx=Math.min(0,p.vx+fr);
  }
  p.vx = Math.max(-maxSp, Math.min(maxSp, p.vx));
  if(Math.abs(p.vx)<0.05) p.vx=0;

  // rooftop solar array: wet panels make the deck a slide along the roof line
  if(footChar==='S' && p.onGround){
    const dir = (level.solarDir===undefined)?1:level.solarDir;
    if(Math.abs(p.vx)<2.4) p.vx=dir*2.4; else p.vx=Math.max(-maxSp-0.6,Math.min(maxSp+0.6,p.vx+0.12*dir));
    if((p.animT|0)%6===0) spawnParticles(p.x+p.w/2, p.y+p.h, 1, '#dff6ff', {up:0.3});
  }

  // timers
  if(p.coyote>0) p.coyote--;
  if(p.invuln>0) p.invuln--;
  if(p.surge>0) p.surge--;
  if(p.impact>0)p.impact--;
  if(p.slide>0)p.slide--;
  if(p.swing>0)p.swing--;
  if(p.tripCd>0)p.tripCd--;
  if(p.coldImmune>0)p.coldImmune--;

  // bearing-grease slide: Down+Jump on ground while greased (consumes the jump press)
  const startSlide = p.slide>0 && p.onGround && Input.down && Input.jumpJustPressed && !p.slideT;
  if(startSlide){ p.slideT=18; p.jumpBuf=0; p.invuln=Math.max(p.invuln,10); AudioEngine.sfx('slide'); }

  // jump buffering from input (edge; player-side buffer survives landing)
  if(Input.jumpJustPressed && !startSlide){ p.jumpBuf = JUMPBUF_FRAMES; }

  // perform jump: buffer + (onGround or coyote)
  if(p.jumpBuf>0){
    if(p.onGround || p.coyote>0){
      let v = JUMP_V;
      // regen dash: launch off a charge pad with a full store — boosted leap
      if(footChar==='G' && (Game.regen||0)>=40){
        v = JUMP_V+1.5;
        p.vx = p.facing*(RUN_SPEED+1.5);
        Game.regen=0;
        AudioEngine.sfx('dash');
        spawnFloatFx('regen dash', p.x-6, p.y-12, '#6cf');
        spawnParticles(p.x+p.w/2, p.y+p.h, 12, '#6cf', {sp:1.6, up:1});
      }
      p.vy = -v;
      p.onGround=false; p.coyote=0; p.jumpBuf=0;
      AudioEngine.sfx('jump');
    } else if(p.jumpBuf>0){ p.jumpBuf--; }
  }

  // variable jump: cap upward velocity on release
  if(!Input.jump && p.vy<0){
    if(p.vy < -JUMP_V*JUMP_CUT) p.vy = -JUMP_V*JUMP_CUT;
  }

  // attack input: X / J / twrench (edge). 32A tier w/ meter -> arc-flash, else wrench swing
  // jump+wrench (either held while the other is pressed) throws a Sealant Tube
  let didThrow=false;
  // QR toll gate: a close scan with the wrench outranks swinging
  if(Input.wrenchJustPressed && !p.dead && !Game.qr){
    const q=scanGate(level,p);
    if(q){ Game.qr=q; AudioEngine.sfx('qrbuzz'); didThrow=true; }
  }
  if(!didThrow && p.seal>0 && !p.dead && p.swing<=0 &&
     ((Input.wrenchJustPressed && Input.jump) || (Input.jumpJustPressed && Input.wrench))){
    throwSealant(p); didThrow=true;
  }
  if(Input.wrenchJustPressed && !p.dead && p.swing<=0 && !didThrow){
    if(Game.power>=2 && Game.arcMeter>=ARC_COST){ fireArc(p); }
    else { p.swing = (p.impact>0? 6: SWING_FRAMES); AudioEngine.sfx('wrench'); swingHits(p,level); }
  }
  if(didThrow){ p.jumpBuf=0; Input.consumeJumpBuffer(); }

  // bearing-grease slide in progress: fast low dash, dust trail
  if(p.slideT>0){
    if(p.onGround){ p.slideT--; p.vx = p.facing*SLIDE_SPEED; if(Math.random()<0.5) spawnParticles(p.x+p.w/2, p.y+p.h, 1, '#e8e4c8', {up:0.6}); }
    else p.slideT=0;
  }

  // --- zone tiles: cable climbing, steam updraft, canopy/lantern glide ---
  {
    const x0=Math.floor((p.x+1)/TILE), x1=Math.floor((p.x+p.w-1)/TILE);
    const y0=Math.floor((p.y+1)/TILE), y1=Math.floor((p.y+p.h-1)/TILE);
    let onC=false, onU=false;
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
      const c=tlChar(level,tx,ty);
      if(c==='C') onC=true;
      else if(c==='U') onU=true;
    }
    if(!p.onGround && onC && Input.up){
      p.vine=true;
      p.vy=-1.15;
      p.vx*=0.55;
      if((p.animT|0)%5===0) spawnParticles(p.x+p.w/2, p.y+2, 1, '#7df', {up:0.3});
    }
    if(onU){
      p.vy-=0.8;
      if(p.vy<-6.2) p.vy=-6.2;
      if((p.animT|0)%4===0) spawnParticles(p.x+p.w/2, p.y+p.h-4, 1, '#fff', {up:1.8, sp:0.6});
    }
    let gl=null;
    if(!p.onGround && !p.vine){
      outer: for(let ty=y0-1;ty<=y1;ty++) for(let tx=x0-1;tx<=x1+1;tx++){
        const c=tlChar(level,tx,ty);
        if(c==='^'||c==='='||c==='L'){ gl={tx,ty,c}; break outer; }
      }
    }
    // hold Up in the air near an awning/lantern rope: slow fall
    if(gl && Input.up && p.vy>-1.6){
      p.vy=Math.min(p.vy,1.3);
      p.vx=Math.max(-maxSp,Math.min(maxSp,p.vx+p.facing*0.05));
      // gusty night market: the wind can tear loose awning tiles mid-glide
      if(level.gust && gl.c!=='L' && Math.random()<0.005){
        level.grid[gl.ty][gl.tx]=' ';
        spawnParticles(gl.tx*TILE+8, gl.ty*TILE+8, 14, '#e8f0f8', {sp:2, up:1.2});
        AudioEngine.sfx('tear');
        spawnFloatFx('wind tore the awning', gl.tx*TILE-12, gl.ty*TILE-10, '#cfd6e0');
      }
    }
  }

  // gravity (held steady on a climbing cable)
  if(p.vine){ p.vy = Input.up? -1.15 : Math.min(p.vy,0.4); p.vine=false; }
  else { p.vy += GRAVITY; }
  if(p.vy>MAX_FALL) p.vy=MAX_FALL;

  const before = p.onGround;
  moveAndCollide(level,p,dt);
  // coyote: refresh on ground, decrement in air
  if(p.onGround) p.coyote=COYOTE_FRAMES;
  else if(p.coyote>0) p.coyote--;

  // HV orange line: standing/jumping into it trips the breaker — crouch to pass under
  hvCollide(level,p);
  // frozen-brittle platforms (Q) crack on the first step
  if(p.onGround){
    const tyq=Math.floor((p.y+p.h+0.5)/TILE);
    const tx0=Math.floor((p.x+2)/TILE), tx1=Math.floor((p.x+p.w-2)/TILE);
    for(let tx=tx0;tx<=tx1;tx++){
      if(tlChar(level,tx,tyq)==='Q'){
        level.grid[tyq][tx]=' ';
        spawnParticles(tx*TILE+8,tyq*TILE+4,8,'#bfe8f5',{up:1});
        AudioEngine.sfx('frostbreak');
        break;
      }
    }
  }

  // animation timer
  if(p.onGround && Math.abs(p.vx)>0.3) p.animT+=Math.abs(p.vx); else p.animT=0;

  // world bounds: fall off bottom
  if(p.y > level.heightPx + 40) killPlayer(p,'fall');

  // arc meter slow regen at higher tiers (real service)
  if(Game.power>0) Game.arcMeter = Math.min(Game.arcMax, Game.arcMeter + (Game.power===2?0.15:0.06));

  // clamp left
  if(p.x<0){p.x=0;p.vx=0;}
  if(p.x+p.w>level.widthPx){p.x=level.widthPx-p.w;p.vx=0;}
}

// ===== SECTION: ATTACK (stage 3) ===========================
function swingRect(p){
  return {x: p.facing>0? p.x+p.w : p.x-12, y: p.y+2, w:12, h:p.h-4};
}
function swingHits(p,level){
  const r=swingRect(p);
  const tx0=Math.floor(r.x/TILE), ty0=Math.floor(r.y/TILE);
  const tx1=Math.floor((r.x+r.w-0.01)/TILE), ty1=Math.floor((r.y+r.h-0.01)/TILE);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    const c=tlChar(level,tx,ty);
    if(c==='B'){ breakBlock(level,tx,ty); }
    else if(c==='W'){ breakWire(level,tx,ty); }
    else if(c==='o'){
      // break the window tile: it vents any drifting gas cloud nearby (the safe
      // way to clear a leak — never arc-flash a gas cloud, it detonates)
      level.grid[ty][tx]=' ';
      const wx=tx*TILE+8, wy=ty*TILE+8;
      let popped=false;
      for(let i=level.enemies.length-1;i>=0;i--){
        const en=level.enemies[i];
        if(en.kind==='gascloud'&&!en.dead&&Math.hypot((en.x+8)-wx,(en.y+6)-wy)<52){
          en.dead=true; popped=true;
          spawnParticles(en.x+8,en.y+6,12,'#d8e8c8',{up:1.2});
          Game.anodes++;
        }
      }
      spawnParticles(wx,wy,8,popped?'#d8e8c8':'#cfe0f0',{up:1});
      AudioEngine.sfx(popped?'hiss':'break');
      spawnFloatFx(popped?'排风 VENTED':'',wx-8,wy-10,'#d8e8c8');
    } else if(c==='V'){
      level.grid[ty][tx]='v';
      spawnParticles(tx*TILE+8,ty*TILE+8,8,'#89a',{up:1});
      spawnFloatFx('capped',tx*TILE-4,ty*TILE-10,'#cfe');
      AudioEngine.sfx('wrench');
    } else if(c==='H'){ hvTrip(p); }
    else if(c==='K'){
      // sea-freight parts crate: wrench it open for an imported part
      level.grid[ty][tx]=' ';
      spawnParticles(tx*TILE+8,ty*TILE+8,10,'#a08260',{up:1.4});
      AudioEngine.sfx('break');
      const it=makeItem('part',tx*TILE+3,ty*TILE-12); it.vy=-3.4; level.items.push(it);
      spawnFloatFx('配件 PART', tx*TILE-6, ty*TILE-18, '#ffd266');
      if(Math.random()<0.5){ const an=makeItem('anode',tx*TILE+9,ty*TILE-12); an.vy=-3; level.items.push(an); }
    }
  }
  meleeHitEnemies(level,r,p);
}
function breakWire(level,tx,ty){
  level.grid[ty][tx]=' ';
  spawnParticles(tx*TILE+8,ty*TILE+8,10,'#d84a2a',{up:1.2});
  AudioEngine.sfx('break');
  if(Math.random()<0.35){ const it=makeItem('anode',tx*TILE+5,ty*TILE-12); it.vy=-3; level.items.push(it); }
}
function ventClouds(level,x,y,n){
  // opening a window vents nearby drifting gas out of the room;
  // with nothing trapped, it only puffs a small fresh gasp
  let vented=0;
  for(const en of level.enemies){
    if(en.kind==='gascloud'&&!en.dead&&Math.abs((en.x+8)-x)<52&&Math.abs((en.y+6)-y)<40){
      en.dead=true; vented++;
      spawnParticles(en.x+8,en.y+6,12,'#e8f4ff',{up:1.2});
    }
  }
  if(vented===0) for(let i=0;i<(n||3);i++){
    level.enemies.push(makeEnemy('gascloud',x+(i-1)*16,y+(i%2)*8,{seed:Math.random()*6,life:540+((Math.random()*120)|0)}));
  }
  AudioEngine.sfx('gas');
  spawnFloatFx(vented?('vented '+vented):'gasp',x-10,y-10,'#b8c48a');
}
function meleeHitEnemies(level,r,p){
  if(!level.enemies) return;
  for(let i=level.enemies.length-1;i>=0;i--){
    const en=level.enemies[i];
    if(en.dead) continue;
    if(en.kind==='crusher'&&!en.parked&&rectHit(r,en.motorX,en.motorY,9,11)){ parkCrusher(level,en); continue; }
    const hr=enRect(en);
    if(!hr||!rectHit(r,hr.x,hr.y,hr.w,hr.h)) continue;
    if(ENEMY_DEF[en.kind].melee){ defeatEnemy(level,en); }
    else {

function hvCollide(level,p){
  if(p.dead||p.tripCd>0) return;
  const x0=Math.floor((p.x+1)/TILE), x1=Math.floor((p.x+p.w-1)/TILE);
  const y0=Math.floor(p.y/TILE), y1=Math.floor((p.y+p.h-0.01)/TILE);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(tlChar(level,tx,ty)==='H'&&p.y<ty*TILE+7.5){ hvTrip(p); return; }
  }
}
function hvTrip(p){
  if(p.dead||p.tripCd>0) return;
  p.tripCd=150;
  if(Game.power>0) Game.power--;
  p.invuln=Math.max(p.invuln,90);
  spawnFloatFx('跳闸 BREAKER',p.x-6,p.y-10,'#ffb347');
  spawnParticles(p.x+p.w/2,p.y+4,10,'#ffb347',{up:1.4});

function fireArc(p){
  const L=Game.level;
  Game.arcMeter-=ARC_COST;
  const pr={
    x: p.facing>0? p.x+p.w : p.x-6, y: p.y+3, w:6, h:5,
    vx: p.facing*ARC_SPEED, vy: -1.8, grav: true,
    t:0, life:80, kind:'arc', draw: fn_arcdraw,
    hit:()=>arcHit(L,pr)
  };
  L.projectiles.push(pr);
  AudioEngine.sfx('arc');
}
function arcHit(L,pr){
  // Z7 boss 220V transfer panel: an arc bolt clears the open-air panel (P2 job).
  // The panel is in OPEN AIR above the deck, so a bolt flying there despawns on it, not on the hull.
  const gb=L.boss;
  if(gb && gb.type==='ghost' && gb.phase===2 && !gb.panel.hit){
    const p=gb.panel;
    if(pr.x+p.w>=p.x && pr.x<=p.x+p.w && pr.y+p.h>=p.y-4 && pr.y<=p.y+p.h+5){
      p.hit=true; Game.shake=8;
      spawnParticles(p.x+p.w/2, p.y+p.h/2, 18, '#7fd8ff', {});
      spawnFloatFx('泄压 220V', p.x, p.y-8, '#7fd8ff');
      AudioEngine.sfx('power2'); return true;
    }
    return false; // panel is in open air; keep flying (the hull solid despawns it if missed)
  }
  if(!L.enemies) return false;
  for(let i=L.enemies.length-1;i>=0;i--){
    const en=L.enemies[i];
    if(en.dead) continue;
    const hr=enRect(en);
    if(!hr||!rectHit(pr,hr.x,hr.y,hr.w,hr.h)) continue;
    if(en.kind==='gascloud'){ gasExplode(L,en); return true; }
    if(en.kind==='serpent'){ popSerpentSeg(L,en); return true; }
    if(ENEMY_DEF[en.kind].arc){ defeatEnemy(L,en); spawnParticles(pr.x+2,pr.y+2,6,'#cfe8ff',{up:1}); }
    else spawnParticles(pr.x+2,pr.y+2,4,'#cfe8ff',{up:1});
    return true;
  }
  return false;
}
function fn_arcdraw(){
  const pr=this, x=Math.round(pr.x-Camera.x), y=Math.round(pr.y-Camera.y);
  ctx.fillStyle='#dff0ff'; ctx.fillRect(x,y+1,6,3);
  ctx.fillStyle='#4d8dff'; ctx.fillRect(pr.vx>0? x-1 : x+4, y, 2, 5);
  ctx.fillStyle='rgba(120,190,255,.45)'; ctx.fillRect(pr.vx>0? x-5 : x+6, y+2, 4, 1);
}
// Sealant Tube throw: caps unsealed roof penetrations ('V' vents and boss targets)
function throwSealant(p){
  const L=Game.level; p.seal--;
  L._sealX=p.x; L._sealY=p.y;
  L.projectiles.push({
    x: p.facing>0? p.x+p.w : p.x-8, y: p.y+2, w:8, h:6,
    vx: p.facing*ARC_SPEED, vy: -2.6, grav: true, t:0, life:80, kind:'seal',
    draw:fn_sealdraw, hit:()=>sealHit(L)
  });
  AudioEngine.sfx('seal');
}
function sealHit(L){
  let capped=false;
  // cap any open roof vent ('V') in a 3x3 tile radius
  const cx=Math.floor((L._sealX+4)/TILE), cy=Math.floor((L._sealY+3)/TILE);
  for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
    if(tlChar(L,cx+ox,cy+oy)==='V'){
      L.grid[cy+oy][cx+ox]='v'; capped=true;
    }
  }
  if(L.boss && L.boss.sealTargets){
    // generous tolerance: a good roof lob can cap several clustered penetrations at once
    for(const t of L.boss.sealTargets){
      if(!t.capped && Math.abs((L._sealX+4)-(t.x+t.w/2))<t.w/2+22 && Math.abs((L._sealY+3)-(t.y+t.h/2))<t.h/2+26){
        t.capped=true; capped=true;
        spawnParticles(t.x+t.w/2, t.y+t.h/2, 12, '#f4f2ea', {up:1.2});
        AudioEngine.sfx('cap');
      }
    }
  }
  if(capped){
    spawnFloatFx('封好 SEALED', L._sealX-10, L._sealY-10, '#eef8ff');
    spawnParticles(L._sealX+4, L._sealY+3, 10, '#f4f2ea', {up:1});
    return true;
  }
  return false;
}
function fn_sealdraw(){
  const pr=this, x=Math.round(pr.x-Camera.x), y=Math.round(pr.y-Camera.y);
  ctx.fillStyle='#fff'; ctx.fillRect(x,y,8,5);
  ctx.fillStyle='#c33'; ctx.fillRect(x,y,8,2);
  ctx.fillStyle='#888'; ctx.fillRect(x+8,y+1,3,3);
}

// shared grid builder: W wide, 18 rows, ground top at row 14
function mkGrid(W){
  const rows=[]; for(let y=0;y<18;y++) rows.push(' '.repeat(W));
  const set=(x,y,c)=>{ if(x>=0&&x<W&&y>=0&&y<18) rows[y]=rows[y].slice(0,x)+c+rows[y].slice(x+1); };
  const holes=(list)=>list.forEach(([a,b])=>{ for(let x=a;x<=b;x++) for(let y=14;y<17;y++) set(x,y,' '); });
  for(let x=0;x<W;x++) for(let y=14;y<18;y++) set(x,y,'#');
  return {rows,set,holes};
}

// ---- Zone 1 Boss: The Pop-Top Terror (Class B, pop-top roof slams like a jaw) ----
function makeBoss(e){
  const bx=e.x*TILE, deckY=e.y*TILE-64;      // deck = van top (one-way W tiles at this height)
  const OPEN_Y=deckY-56, CLOSED_Y=deckY-8;   // panel top when open / flushed down
  const b={
    kind:'poptop', x:bx, w:80, deckY, deckX1:bx+128, y:e.y*TILE, h:64,
    t:0, phase:'intro', phaseT:0, roofY:OPEN_Y,
    hp:3, dead:false, deadT:0,
    hinges:[10,36,62].map(dx=>({x:bx+dx, y:deckY-8, w:10, h:8, hp:1})),
    update(dt){
      const L=Game.level, p=Game.player;
      const fr=dt*60;                             // motion is per-step; keep timers in frames
      b.t+=fr; b.phaseT+=fr;
      if(b.dead){
        b.deadT+=fr;
        b.roofY-=3;                            // panel pops off
        if((b.t|0)%8===0) spawnParticles(b.x+Math.random()*b.w, deckY+20, 6, '#d9a44a', {up:1.6});
        if(b.deadT>110 && !L.cleared) onLevelClear();
        return;
      }
      const target = b.phase==='open'||b.phase==='windup'||b.phase==='intro'? OPEN_Y : CLOSED_Y;
      if(b.roofY>target) b.roofY=Math.max(target,b.roofY-2.2);
      else if(b.roofY<target) b.roofY=Math.min(target,b.roofY+2.2);
      const DUR={intro:70, open:130, windup:45, slam:12, closed:70, lift:26}[b.phase]||9999;
      if(b.phaseT>=DUR){
        b.phaseT=0;
        const nx={intro:'open', open:'windup', windup:'slam', slam:'closed', closed:'lift', lift:'open'}[b.phase];
        if(nx){
          b.phase=nx;
          if(nx==='windup'){ AudioEngine.sfx('charge'); spawnFloatFx('!', b.x+b.w/2, OPEN_Y-24, '#ff5a4a'); }
          if(nx==='slam'){ Game.shake=Math.max(Game.shake,10); AudioEngine.sfx('slam'); spawnParticles(b.x+b.w/2, CLOSED_Y, 14, '#cfe8ff', {up:1.1}); }
          if(nx==='open'){ AudioEngine.sfx('pop'); }
        }
      }
      // slam sweep is fast
      if(b.phase==='slam') b.roofY=Math.min(CLOSED_Y, b.roofY+(CLOSED_Y-OPEN_Y)/12);
      if(p&&!p.dead){
        // crush: panel rect vs player while slamming or flushed down
        const cz={x:b.x+6, y:b.roofY, w:b.w-12, h:8};
        if((b.phase==='slam'||b.phase==='closed'||b.phase==='lift') && p.invuln<=0 && p.surge<=0 && rectHit(p,cz.x,cz.y,cz.w,cz.h)) killPlayerFn(p,'crush');
        // stomp the gas-strut hinges while roof is open
        if(b.phase==='open'||b.phase==='intro'){
          for(const hg of b.hinges){
            if(hg.hp<=0) continue;
            if(rectHit(p,hg.x,hg.y,hg.w,hg.h) && p.vy>0.3 && (p.y+p.h)-hg.y<9){
              hg.hp=0; b.hp--; p.vy=-STOMP_BOUNCE*1.2;
              spawnParticles(hg.x+5,hg.y+4,12,'#ffd24a',{up:1.5});
              AudioEngine.sfx('clang');
              spawnFloatFx('铰链 HINGE ×'+Math.max(0,b.hp), hg.x-6, hg.y-14, '#ffd24a');
              if(b.hp<=0){
                b.dead=true; b.deadT=0; Game.shake=14; AudioEngine.sfx('kill');
                spawnParticles(b.x+b.w/2, deckY+16, 30, '#d9a44a', {up:2});
              }
            }
          }
        }
      }
    },
    draw(){
      const cam=Camera.x, x=Math.round(b.x-cam), deck=b.deckY;
      const shake=(b.phase==='windup')? (Math.random()*2-1) : (b.phase==='slam'? (Math.random()*3-1.5):0);
      // van body (Class B)
      ctx.fillStyle='#2a2c30';                 // wheels
      ctx.beginPath(); ctx.arc(x+18, deck+57, 7, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x+62, deck+57, 7, 0, 7); ctx.fill();
      ctx.fillStyle='#e8e2d0';                 // body
      ctx.fillRect(x+2, deck, b.w-4, 54);
      ctx.fillStyle='#cfc8b2'; ctx.fillRect(x+2, deck+34, b.w-4, 4);
      ctx.fillStyle='#9fd8e8';                 // windshield
      ctx.fillRect(x+4, deck+8, 12, 14);
      ctx.fillStyle='#fff';                    // angry eye
      ctx.fillRect(x+6, deck+14, 5, 3);
      ctx.fillStyle=(b.phase==='windup'||b.phase==='slam')?'#ff5a4a':'#222';
      ctx.fillRect(x+7, deck+15, 3, 2);
      // gas-strut hinges on deck (exposed when roof open)
      for(const hg of b.hinges){
        if(hg.hp<=0) continue;
        ctx.fillStyle='#ffd24a';
        ctx.fillRect(Math.round(hg.x-cam), deck-8, 10, 8);
        ctx.fillStyle='#8a6a1a';
        ctx.fillRect(Math.round(hg.x-cam)+2, deck-5, 6, 3);
      }
      // service ramp (right of the van, safe from the roof)
      ctx.fillStyle='#3a3d42';
      ctx.fillRect(x+b.w, deck, b.deckX1-b.x-b.w, 8);
      ctx.fillStyle='#26282c';
      ctx.fillRect(x+b.w+18, deck+8, 6, 48);
      // pop-top panel
      const ry=Math.round(b.roofY+shake);
      ctx.fillStyle='#b8452f';
      ctx.fillRect(x+6, ry, b.w-12, 8);
      ctx.fillStyle='#8a2f1f'; ctx.fillRect(x+6, ry+6, b.w-12, 2);
      ctx.strokeStyle='#5a4632'; ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x+14, deck-4); ctx.lineTo(x+14, ry+8);
      ctx.moveTo(x+66, deck-4); ctx.lineTo(x+66, ry+8);
      ctx.stroke();
    },
  };
  return b;
}

// ---- ZONE 7 FINAL BOSS: 灰产幽灵 Gray-Market Ghost ----
// The last unlicensed Class A leaves the lot as a parts-orphan: every panel is a
// "to be continued". You climb onto its roof (the one-way deck above the hull) and
// finish three open jobs to make it roadworthy. Each job is a phase:
//   P1 12V 直流  battery tripping   -> stomp the under-dash fuse (3x), kill the interior lights
//   P2 220V 交流 A/C dive-bombs     -> 220V transfer switch (arc the panel in open air)
//   P3 水路  plumbing  sludge       -> cap 3 roof penetrations with sealant
// All attacks are ground-level, in front of the van; the deck is the ONLY safe zone.
// Victory: the 检查引擎 (check-engine) light dies, a forklift rolls the orphan in,
// a 验收合格 (PASSED) sticker is slapped on, and "JOB CLOSED, NO PARTS PENDING".
function makeGhost(e){
  const bx=e.x*TILE, deckY=e.y*TILE-64, BW=(e.w||18)*TILE, GROUND=deckY+64;
  const b={
    x:bx, w:BW, deckY, y:deckY, h:GROUND-deckY,
    type:'ghost',
    phase:1, boardT:0, boarded:false,
    sw:{x:bx+4*TILE, y:deckY-8, w:12, h:8, hp:3, hit:false},    // P1 fuse (stomp 3x)
    panel:{x:bx+7*TILE, y:deckY-22, w:14, h:18, hit:false},     // P2 panel (open air)
    peels:null, sealTargets:null,
    check:true, dead:false, deadT:0,
    sparks:[], ac:null, shockT:0, sludgeT:0, _sludge:null, _jab:null, _f1:0, _jp:0,
    bob:0,
    hurt(){ b.check=false; },
    onDeck(p){ const f=p.y+p.h; return p.onGround && Math.abs(f-deckY)<8; },
  };
  b.peels=[0,6,12].map(dx=>({ x:bx+10*TILE+6+dx, y:deckY-7, w:8, h:7, capped:false }));

  function alive(){ return Game.player && !Game.player.dead; }
  function touch(p,r){ return rectHit(p, r.x, r.y, r.w, r.h); }

  b.update=function(dt){
    if(b.dead){
      b.deadT++;
      if(b.deadT>150 && Game.state==='play'){ Game.level.cleared=true; Game.state='done'; AudioEngine.stopMusic(); }
      else if(b._jab) stepJab();
      return;
    }
    b.bob++;
     // board tracking: no attacks until the tech is actually on the deck (a lead-in beat).
     // Latch "armed" once the lead-in completes so the fuse/panel seals can still be whacked
     // mid-air (a stomp is airborne, which momentarily un-boards the tech).
     if(alive()){ if(b.onDeck(Game.player)){ if(!b.boarded) b.boardT=0; b.boarded=true; b.boardT++; } else b.boarded=false; }
     if(b.boardT>30) b.armed=true;
     const canAct = !!b.armed;
    // seal targets only while capping (P3)
    b.sealTargets = (b.phase===3 && !b.dead) ? b.peels : null;
    if(b.phase===1) ph1(canAct);
    else if(b.phase===2) ph2(canAct);
    else ph3(canAct);
    // cull ground jabs/sludge even when idle so nothing lingers forever
    stepJab();
    // advance phase on victory of each job
    if(b.phase===1 && b.sw.hit){ b.phase=2; b.check=true; AudioEngine.sfx('charge'); spawnFloatFx('断路!', bx+2*TILE, deckY-30, '#ffd24a'); }
    else if(b.phase===2 && b.panel.hit){ b.phase=3; b.ac=null; b.shockT=0; AudioEngine.sfx('charge'); spawnFloatFx('泄压!', bx+7*TILE, deckY-34, '#7fd8ff'); }
  };

  function stepJab(){
    const j=b._jab; if(!j) return;
    j.t--; j.x+=j.vx;
    if(j.t<=0) b._jab=null;
    else if(alive() && touch(Game.player, j)) hurtPlayer(Game.player,1);
  }
  function stepSludge(){
    const s=b._sludge; if(!s) return;
    s.t--; s.x+=s.vx;
    if(s.t<=0) b._sludge=null;
    else if(alive() && touch(Game.player, s)) hurtPlayer(Game.player,1);
  }

  // ---- P1: 12V DC spark orbs. Stomp the fuse 3x to kill the interior lights. ----
  function ph1(canAct){
    for(let i=b.sparks.length-1;i>=0;i--){
      const s=b.sparks[i]; s.t--; s.x+=s.vx; s.y+=s.vy;
      if(s.t<=0){ b.sparks.splice(i,1); continue; }
      if(alive() && touch(Game.player, {x:s.x-6,y:s.y-4,w:12,h:8})) hurtPlayer(Game.player,1);
    }
    if(canAct){
      if(b._f1===0){
        const n=1+(Math.random()<0.4?1:0);
        for(let i=0;i<n;i++) b.sparks.push({x:bx-8, y:deckY+44+(Math.random()*14|0), vx:1.3+i*0.3, vy:0, t:170});
        b._f1=70; AudioEngine.sfx('spark');
      }
      b._f1--;
      if(!b.sw.hit && alive()){
        const p=Game.player;
        if(touch(p,{x:b.sw.x-2,y:b.sw.y-22,w:b.sw.w+4,h:22+b.sw.h}) && (p.y+p.h)-b.sw.y < 12 && p.vy>0.3){
          b.sw.hp--; AudioEngine.sfx('clang'); Game.shake=Math.max(Game.shake,5);
          spawnParticles(b.sw.x+b.sw.w/2, b.sw.y, 6, '#ffd24a', {up:1});
          if(b.sw.hp<=0){ b.sw.hit=true; b.sparks.length=0; AudioEngine.sfx('power2'); Game.shake=Math.max(Game.shake,9); spawnFloatFx('断路', b.sw.x, b.sw.y-10, '#ffd24a'); }
        }
      }
    }
  }

  // ---- P2: 220V A/C dive-bombs + GROANGEN shockwaves. Arc the 220V panel. ----
  function ph2(canAct){
    for(let i=b.sparks.length-1;i>=0;i--){
      const s=b.sparks[i]; s.t--; s.x+=s.vx; s.y+=s.vy; s.vy+=0.06;
      if(s.t<=0 || s.y>GROUND-2){ b.sparks.splice(i,1); continue; }
      if(alive() && touch(Game.player, {x:s.x-3,y:s.y-3,w:8,h:8})) hurtPlayer(Game.player,1);
    }
    if(!canAct) return;
    if(!b.ac){ b.ac={x:bx-60, y:deckY+38, t:0, cd:50}; AudioEngine.sfx('hiss'); }
    const A=b.ac; A.t++; A.cd--;
    A.x += ((bx-40)>A.x? 0.5 : -0.5);
    if(A.cd<=0 && A.t>30){
      for(let i=0;i<5;i++) b.sparks.push({x:A.x+i*8, y:A.y, vx:0, vy:1.0+i*0.15, t:160});
      A.cd=95; b.shockT=1; AudioEngine.sfx('spark');
    }
    if(A.t>720) b.ac=null;
    if(b.shockT>0 && b.shockT<42){
      b.shockT++;
      if(b.shockT===20 && alive() && Game.player.x < bx-30) hurtPlayer(Game.player,1); // GROANGEN front-blow
    }
  }

  // ---- P3: plumbing sludge + Drip Goblins + slide punches. Cap the roof penetrations. ----
  function ph3(canAct){
    if(!canAct) return;
    b.sludgeT++;
    if(b.sludgeT===1){ b._sludge={x:bx-30, y:GROUND-12, vx:-0.5, t:260, w:16, h:12}; AudioEngine.sfx('drip'); }
    stepSludge();
    if((b.sludgeT%150)===1 && Game.level.enemies.length<3){ Game.level.enemies.push(makeEnemy('goblin', bx-16, GROUND-13, {f:-1})); AudioEngine.sfx('drip'); }
    b._jp++;
    if(b._jp%90===1){ b._jab={x:bx-8, y:deckY+34, vx:-2.4, t:60, w:14, h:10}; AudioEngine.sfx('hiss'); }
    if(b.peels.every(pe=>pe.capped)){
      b.dead=true; b.deadT=0; Game.shake=16; AudioEngine.sfx('kill');
      spawnParticles(bx+BW/2, deckY, 40, '#9be7a4', {up:1.6});
    }
  }

  b.draw=function(camX){
    const x=b.x-camX, top=b.y, bh=b.h;
    const C=Game.level.palette;
    ctx.save();
    ctx.globalAlpha = b.dead? Math.max(0,1-b.deadT/70) : 0.92;
    const bodyTop=top+6, bodyH=bh-6;
    ctx.fillStyle = C.blockShade; rrect(x+10, bodyTop, b.w-20, bodyH, 6); ctx.fill();   // hull
    ctx.fillStyle = '#dfe8f2'; rrect(x+14, bodyTop+3, b.w-28, 12, 4); ctx.fill(); // roof cap
    ctx.fillStyle = C.blockShade; rrect(x+18, bodyTop+18, 22, 18, 3); ctx.fill();       // windshield
    for(let i=0;i<4;i++){ ctx.fillStyle='#c2d2e2'; ctx.fillRect(x+56+i*28, bodyTop+20, 18, 12); }
    ctx.fillStyle = C.ground;
    ctx.beginPath(); ctx.arc(x+40, top+bh, 9, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+b.w-44, top+bh, 9, 0, 7); ctx.fill();
    // headlight
    ctx.fillStyle = b.check? '#ffc23a':'#6b7280'; ctx.fillRect(x+12, bodyTop+10, 6, 6);
    // 检查引擎 (CHECK ENGINE) indicator lamp — the amber light that must die
    ctx.fillStyle = b.check? '#ff8a3a':'#4b5563'; ctx.fillRect(x+b.w-26, bodyTop+5, 14, 8);
    if(b.check && !b.dead){ ctx.fillStyle='rgba(255,138,58,'+(0.35+0.5*Math.abs(Math.sin(b.bob*0.15)))+')'; ctx.fillRect(x+b.w-28, bodyTop+3, 18, 12); }
    // P1 interior lights strobe + 12V spark bolts
    if(b.phase===1 && !b.sw.hit){
      const on=(b.bob>>3)&1; ctx.fillStyle = on? '#0c1016':'#3a2b1a';
      for(let i=0;i<5;i++) ctx.fillRect(x+30+i*42, bodyTop+28, 26, 8);
      for(const s of b.sparks){ if(s.vy===0){ ctx.fillStyle='#ffd24a'; ctx.fillRect(s.x-camX, s.y, 11, 4); ctx.fillStyle='#fff7cf'; ctx.fillRect(s.x-camX+2, s.y-1, 7, 2); } }
    }
    // P1 fuse switch
    if(b.phase===1){ const s=b.sw; ctx.fillStyle = s.hit? '#3a4a3a':'#5a5a6a'; ctx.fillRect(s.x-camX, s.y, s.w, s.h); ctx.fillStyle = s.hit? '#9be7a4':'#ff5a4a'; ctx.fillRect(s.x-camX+3, s.y+2, s.w-6, s.h-4); }
    // P2: 220V panel (open air), A/C condenser, AC orbs, GROANGEN shockwave
    if(b.phase===2 && !b.panel.hit){
      const p=b.panel; ctx.fillStyle = '#5a4a2a'; ctx.fillRect(p.x-camX, p.y, p.w, p.h);
      ctx.fillStyle = '#ffcf3a'; ctx.fillRect(p.x-camX+3, p.y+3, p.w-6, 3);
      ctx.fillStyle='#1a1a1a'; ctx.fillRect(p.x-camX+3, p.y+8, p.w-6, p.h-11);
      ctx.strokeStyle='#ffe08a'; ctx.strokeRect(p.x-camX, p.y, p.w, p.h);
      if(b.ac){ const A=b.ac; ctx.fillStyle='#8fa8c8'; ctx.fillRect(A.x-camX-8, A.y-8, 24, 16); ctx.fillStyle='#2a2a2a'; ctx.fillRect(A.x-camX-6, A.y-6, 20, 4); if((b.bob>>2)&1){ ctx.fillStyle='#7fd8ff'; ctx.fillRect(A.x-camX+2, A.y+2, 4, 4);} }
      for(const s of b.sparks){ ctx.fillStyle='#7fd8ff'; ctx.fillRect(s.x-camX, s.y, 5, 5); ctx.fillStyle='#eaffff'; ctx.fillRect(s.x-camX+1, s.y+1, 3, 3); }
    }
    if(b.shockT>0 && b.shockT<42){
      const r=b.shockT*2.2; ctx.strokeStyle='rgba(127,216,255,'+(1-b.shockT/42)+')';
      ctx.beginPath(); ctx.arc((bx-50)-camX, GROUND, r, Math.PI, 2*Math.PI); ctx.stroke();
    }
    // P3: roof penetrations, sludge, slide jab, goblins (drawn as enemies)
    if(b.phase===3 || b.dead){
      for(const pe of b.peels){
        ctx.fillStyle = pe.capped? '#9be7a4':'#7a5a3a';
        ctx.beginPath(); ctx.ellipse(pe.x-camX+pe.w/2, pe.y+pe.h/2, pe.w/2, pe.h/2, 0, 0, 7); ctx.fill();
        if(!pe.capped){ ctx.strokeStyle='#c98a4a'; ctx.stroke(); }
      }
      if(b._sludge){ const s=b._sludge; ctx.fillStyle='#4a3520'; ctx.beginPath(); ctx.ellipse(s.x-camX+s.w/2, s.y+s.h/2, s.w/2, s.h/2+3, 0,0,7); ctx.fill(); }
      if(b._jab){ const j=b._jab; ctx.fillStyle='#c98a4a'; ctx.fillRect(j.x-camX, j.y, j.h, j.h); }
    }
    // VICTORY: forklift rolls in, 验收合格 sticker slaps on
    if(b.dead){
      const ft=Math.min(1, b.deadT/90);
      const fx = -40 + ft*(bx-50);
      ctx.fillStyle='#e0a335'; ctx.fillRect(fx-camX, GROUND-16, 34, 16);
      ctx.fillStyle='#1a1a1a'; ctx.fillRect(fx-camX+3, GROUND-2, 10, 4); ctx.fillRect(fx-camX+22, GROUND-2, 10, 4);
      ctx.fillStyle='#8a5a2a'; ctx.fillRect(fx-camX+30, GROUND-30, 4, 30);
      if(ft>0.78){
        ctx.globalAlpha=Math.min(1,(b.deadT-70)/20);
        ctx.fillStyle='#7a2a2a'; rrect(x+b.w/2-16, bodyTop+1, 32, 14, 3); ctx.fill();
        ctx.fillStyle='#ffe9e9'; ctx.font='9px monospace'; ctx.textAlign='center';
        ctx.fillText('验收合格', x+b.w/2, bodyTop+12);
        ctx.globalAlpha=1;
      }
    }
    ctx.restore();
  };

  return b;
}

// ---- spawn level actors from def entities ----
function spawnLevelActors(Lv){
  Lv.items=[];
  const evs=Lv.entities||[];
  evs.forEach(e=>{
    const px=e.x*TILE, py=e.y*TILE;
    if(e.kind==='anodes'){ for(let i=0;i<e.n;i++) Lv.items.push(makeItem('anode', px+i*14, py, 1)); }
    else if(e.kind==='flag'){}
    else if(e.kind==='order' || e.kind==='sealant' || e.kind==='torque' || e.kind==='cee'
          || e.kind==='surge' || e.kind==='shield' || e.kind==='impact' || e.kind==='tea'
          || e.kind==='oneup' || e.kind==='mooncake' || e.kind==='grease' || e.kind==='part'){
      Lv.items.push(makeItem(e.kind, px, py, 1));
    }
    else if(e.kind==='npc'){ Lv.npcs.push(makeNPC(e.type, px, py)); }
    else if(e.kind==='pedestal'){ Lv.npcs.push({type:'pedestal', a:e.a||16, x:px, y:py, w:14, h:26, used:false, t:0, pulse:0, draw:fn_npcdraw}); }
    else if(e.kind==='dump'){ Lv.dumpRoom = {x:px, y:py, black:false, solved:false, failed:false, flood:0, t:0}; }
    else if(e.kind==='boss'){ if(e.type==='ghost') Lv.boss = makeGhost(e); else Lv.boss = makeBoss(e); }
    else if(e.kind==='enemy'){ Lv.enemies.push(makeEnemy(e.type, px, py, e.opt||{})); }
    else if(e.kind==='seesaw'){ Lv.gadgets.push({type:'seesaw', x:px, y:py, w:144, t:0, angle:0, ride:0, draw:fn_gadgetdraw}); }
    else if(e.kind==='partgate'){ Lv.gadgets.push({type:'partgate', x:px, y:py, w:16, h:48, opened:false, t:0, draw:fn_gadgetdraw}); }
    else if(e.kind==='sitecheck'){ Lv.gadgets.push({type:'sitecheck', x:px, y:py, done:false, qte:null, t:0, draw:fn_gadgetdraw}); }
    else if(e.kind==='tunnel'){ Lv.gadgets.push({type:'tunnel', x:px, y:py, w:48, ceil:py-196, cd:0, draw:fn_gadgetdraw}); }
    else if(e.kind==='lift'){ Lv.gadgets.push({type:'lift', x:px, baseY:py, y:py, w:48, t:0, draw:fn_gadgetdraw}); }
    else if(e.kind==='spinner'){ Lv.gadgets.push({type:'spinner', cx:px+16, cy:py+16, r:e.r||36, t:0, px:0, py:0, draw:fn_gadgetdraw}); }
    else if(e.kind==='charger'){ Lv.npcs.push({type:'charger', x:px, y:py, t:0, w:20, h:30, draw:fn_npcdraw}); }
  });
  // open vents (tile 'V') drip goblins until capped
  Lv.vents=[];
  for(let ty=0;ty<Lv.h;ty++)for(let tx=0;tx<Lv.w;tx++) if(Lv.grid[ty][tx]==='V') Lv.vents.push({tx,ty});
}
function makeItem(type,x,y){
  return {type, x, y, t:Math.random()*6, r:7, active:true, vx:0, vy:0, grounded:false};
}
function makeNPC(type,x,y){
  return {type, x, y, t:0, w:14, h:24, draw:fn_npcdraw};
}
function fn_npcdraw(){
  const np=this, x=Math.round(np.x-Camera.x), y=Math.round(np.y-Camera.y);
  np.t+=0.1;
  if(np.type==='sign'){
    // wooden bilingual signpost
    ctx.fillStyle='#8a5a2a'; ctx.fillRect(x+6, y-12, 4, 24);
    ctx.fillStyle='#e8d5a8'; ctx.fillRect(x-8, y-30, 32, 20);
    ctx.fillStyle='#b0925a'; ctx.fillRect(x-8, y-30, 32, 2); ctx.fillRect(x-8, y-12, 32, 2);
    drawText(np.text||'营地', x+8, y-19, '#3a2410', 10, true, true);
    if(np.sub) drawText(np.sub, x+8, y-12, '#6a4a20', 0, false, true);
  } else if(np.type==='pedestal'){
    // camp power pedestal (checkpoint)
    const a=np.a||16;
    ctx.fillStyle='#d8dde2'; ctx.fillRect(x, y-30, 14, 32);
    ctx.fillStyle='#9aa2aa'; ctx.fillRect(x, y-30, 14, 3);
    ctx.fillStyle= np.used? '#33d17a':'#c93';
    ctx.fillRect(x+3, y-23, 8, 8);
    ctx.fillStyle='#1e5fff';
    ctx.beginPath(); ctx.arc(x+7, y-19, 3, 0, 7); ctx.fill();
    if(np.pulse>0 && Math.floor(np.t*4)%2===0){ ctx.fillStyle='rgba(120,220,255,'+Math.max(0,0.5-np.pulse/60)+')'; ctx.fillRect(x-4,y-34,22,38); }
    drawText(a+'A', x-2, y+10, '#445', 0);
  } else if(np.type==='store'){
    // camp store kiosk
    ctx.fillStyle='#c9a15a'; ctx.fillRect(x, y-10, 40, 4);
    ctx.fillStyle='#8a5a2a'; ctx.fillRect(x+2,y-6,6,26); ctx.fillRect(x+32,y-6,6,26);
    ctx.fillStyle='#f2e4c0'; ctx.fillRect(x+8,y-2,24,20);
    drawText('小卖部', x+9, y+8, '#5a3a1a', 8, true);
    drawText('STORE', x+16, y+18, '#3a2a14', 0);
  } else if(np.type==='xiangqi'){
    ctx.fillStyle='#6a5a4a'; ctx.fillRect(x, y+6, 26, 4); // stone table
    ctx.fillStyle='#3a6a9a'; ctx.fillRect(x+2,y-6,8,12); // retiree 1
    ctx.fillStyle='#a04a3a'; ctx.fillRect(x+16,y-6,8,12); // retiree 2
    ctx.fillStyle='#e8d0a0'; ctx.beginPath(); ctx.arc(x+6,y-9,3,0,7); ctx.fill();
    ctx.fillStyle='#e8d0a0'; ctx.beginPath(); ctx.arc(x+20,y-9,3,0,7); ctx.fill();
    ctx.fillStyle='#3a3a3a'; ctx.fillRect(x+10,y+4,4,4); // board
  } else if(np.type==='hotpot'){
    ctx.fillStyle='#7a3a2a'; ctx.fillRect(x, y+2, 28, 8);
    ctx.fillStyle='#3a3a3a'; ctx.fillRect(x+4,y-4,20,6);
    ctx.fillStyle='rgba(255,255,255,.5)'; for(let i=0;i<4;i++){ const sy=y-8-((np.t*4+i*6)%12); ctx.fillRect(x+8+i*4, sy,2,3); } // steam
  } else if(np.type==='dance'){
    for(let i=0;i<4;i++){ const ox=Math.sin(np.t*2+i)*4; ctx.fillStyle=['#c0392b','#2980b9','#27ae60','#8e6bb0'][i]; ctx.fillRect(x+i*8+ox, y+2,5,12); ctx.fillStyle='#f0d9b8'; ctx.fillRect(x+i*8+ox+1,y-2,3,4); }
  } else if(np.type==='charger'){
    // EV fast-charge bank: a pillar of chargers with a glowing screen
    ctx.fillStyle='#2f4a6a'; ctx.fillRect(x, y-26, 20, 28);
    ctx.fillStyle='#1e3348'; ctx.fillRect(x, y-26, 20, 4);
    ctx.fillStyle='#7fe8a8'; ctx.fillRect(x+3,y-18,14,10);
    ctx.fillStyle='#1e5f3c'; ctx.fillRect(x+4,y-15,12,1); ctx.fillRect(x+4,y-12,9,1);
    ctx.fillStyle='#cfe8ff'; ctx.fillRect(x+17,y-4,3,10);
    if(np.t%2<1){ ctx.fillStyle='#d8ffee'; ctx.fillRect(x+5,y-16,6,3); }
  }
}

let GamE_anim=0;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;

function scaleCanvas(){
  const wrap=document.getElementById('wrap');
  const ww=wrap.clientWidth, wh=wrap.clientHeight;
  const scale=Math.min(ww/VIEW_W, wh/VIEW_H);
  canvas.style.width=(VIEW_W*scale)+'px';
  canvas.style.height=(VIEW_H*scale)+'px';
  ctx.imageSmoothingEnabled=false;
}
window.addEventListener('resize',scaleCanvas);

function drawText(txt,x,y,color,size,cjk,center){
  ctx.font = cjk? (size>=10?CJK_FONT_L:CJK_FONT) : PIX_FONT;
  ctx.fillStyle=color||'#fff';
  if(center){ ctx.textAlign='center'; } else { ctx.textAlign='left'; }
  ctx.fillText(txt,Math.round(x),Math.round(y));
  ctx.textAlign='left';
}
function drawPlayer(p){
  const x=Math.round(p.x-Camera.x), y=Math.round(p.y-Camera.y);
  const f=p.facing;
  // body (coveralls)
  ctx.fillStyle = p.invuln>0 && (Math.floor(Game.timer*20)%2)? '#fff':'#2f6fb0';
  ctx.fillRect(x, y+ (p.crouch?0:2), p.w, p.h-(p.crouch?0:2));
  // head
  if(Game.power>0){ // hard hat (16A/32A)
    ctx.fillStyle='#f2c94c';
    ctx.fillRect(x-1,y- (p.crouch?0:2), p.w+2, 3);
    ctx.fillStyle= Game.power===2? '#1e5fff':'#e0a800';
    ctx.fillRect(x,y-1 -(p.crouch?0:2),p.w,2);
  }
  // face
  ctx.fillStyle= Game.power>0? '#f0d9b8':'#333';
  ctx.fillRect(x+ (f>0?2:1), y+3, 7, 3);
  ctx.fillStyle='#111';
  ctx.fillRect(x+(f>0?6:1), y+3,1,2);
  // QR phone: held up scanning a toll-gate door
  if(Game.qr){
    const qx = f>0? x+p.w+1 : x-5;
    ctx.fillStyle='#222'; ctx.fillRect(qx, y+1, 4, 8);
    ctx.fillStyle='#7ff0e8'; ctx.fillRect(qx+1, y+2, 2, 4);
    const gxs=Math.round(Game.qr.x - Camera.x);
    ctx.strokeStyle='rgba(127,240,232,.8)'; ctx.lineWidth=2;
    ctx.beginPath();
    if(f>0){ ctx.moveTo(qx+4,y+4); ctx.lineTo(gxs,y+4); }
    else { ctx.moveTo(qx,y+4); ctx.lineTo(gxs+16,y+4); }
    ctx.stroke();
    drawText('扫码…', qx-4, y-6, '#7ff0e8', 8, true);
  }
  // cog: bearing-grease slide pose
  if(p.slideT>0){
    ctx.fillStyle='#c8c255'; ctx.fillRect(x-4,y+p.h-2,p.w+8,2);
  }
  // surge protector/EMS: glow + cycling readout
  if(p.surge>0){
    const ph=Math.floor(Game.timer*3)%3;
    const label = ph===0? '电压正常' : ph===1? 'VOLTAGE OK' : 'GROUND OK';
    ctx.strokeStyle = (Math.floor(Game.timer*12)%2)? '#6cf':'#fff';
    ctx.lineWidth=1;
    ctx.strokeRect(x-2,y-3,p.w+4,p.h+5);
    drawText(label, x+p.w/2-16, y-7, '#7ff0e8', 8, ph===0, false);
  }
  // butyl & sealant shield: white tape roll on the back
  if(p.shield){
    const bx = f>0? x-3 : x+p.w+1;
    ctx.fillStyle='#f4f2ea'; ctx.beginPath(); ctx.arc(bx+1, y+7, 4, 0, 7); ctx.fill();
    ctx.fillStyle='#b8b2a4'; ctx.beginPath(); ctx.arc(bx+1, y+7, 1.5, 0, 7); ctx.fill();
  }
  // impact driver on the back (x2 swing speed)
  if(p.impact>0){
    const bx = f>0? x-3 : x+p.w+1;
    if(!p.shield){
      ctx.fillStyle='#222'; ctx.fillRect(bx, y+5, 3, 7);
      ctx.fillStyle='#0ff'; ctx.fillRect(bx, y+4, 3, 2);
    }
  }
  // wrench swing
  if(p.swing>0){
    ctx.strokeStyle= Game.power>=2? '#bfe0ff':'#cfd6e0'; ctx.lineWidth=2;
    const sx=x+(f>0? p.w:0);
    const t=1-p.swing/Math.max(1,(p.impact>0?6:10));
    ctx.beginPath();
    ctx.moveTo(sx, y+6);
    ctx.lineTo(sx + f*(6+10*t), y+ (4-8*Math.sin(t*Math.PI)) );
    ctx.stroke();
    if(Game.power>=2 && (Math.floor(Game.timer*30)%2)){ // 32A: wrench crackles
      const tx0=sx + f*(6+10*t), ty0=y+(4-8*Math.sin(t*Math.PI));
      ctx.fillStyle='#9fd0ff'; ctx.fillRect(tx0-1,ty0-2,2,2); ctx.fillRect(tx0+f*2,ty0+1,2,1);
    }
  }
}
function render(){
  ctx.fillStyle='#0b0e14'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  if(Game.state==='play'||Game.state==='paused'){
    renderLevel();
    if(!Game.player.dead) drawPlayer(Game.player);
    else drawDeadPlayer(Game.player);
    renderHUD();
    if(Game.state==='play'&&Game._introT>0&&Game.level.bossIntro) renderBossIntro();
    if(Game.state==='paused') renderPause();
  } else if(Game.state==='title'){
    renderTitle();
  } else if(Game.state==='map'){
    renderMap();
  } else if(Game.state==='over'){
    renderGameOver();
  } else if(Game.state==='clear'){
    renderTitle(); renderClear();
  } else if(Game.state==='done'){
    renderLevel();
    if(Game.player && !Game.player.dead) drawPlayer(Game.player);
    renderHUD();
    renderDone();
  } else {
    renderTitle();
  }
}
function renderClear(){

  drawBigText('完工 SERVICE COMPLETE', VIEW_W/2, 90);

  for(let i=0;i<14;i++){ const a=GamE_anim*2+i; ctx.fillRect(VIEW_W/2+Math.cos(a)*40*Math.sin(GamE_anim+i), 120+Math.sin(a)*30,2,2); }
  const timeBonus=Math.max(0,Math.ceil(L.clearedAt))*2;
  const orders=Game.servicesFound.filter(s=>s.level===Game.levelIndex).length;
  drawText('TIME BONUS  +'+timeBonus, VIEW_W/2, 160, '#ffd266', 0, false, true);
  drawText('ANODE RODS  '+Game.anodes, VIEW_W/2, 176, '#dfe8f2', 0, false, true);
  drawText('SERVICE ORDERS  '+orders+' / 3  '+(orders>=3?'完工 / JOB CLOSED':''), VIEW_W/2, 192, '#8fe3b0', 0, false, true);
  Game.anodes+=Math.max(0,timeBonus-Math.max(0,L._bonusGiven||0)); L._bonusGiven=timeBonus;
    if(Game._clearT>1.2) drawText('Press Enter / tap to continue', VIEW_W/2, 236, '#8fa6d6', 0, false, true);
}
function renderBossIntro(){
  const a=Math.min(1, Game._introT/30);
  ctx.save(); ctx.globalAlpha=a;
  ctx.fillStyle='rgba(8,6,14,.86)'; ctx.fillRect(0,40,VIEW_W,54);
  ctx.fillStyle='rgba(255,138,58,.5)'; ctx.fillRect(0,40,VIEW_W,2); ctx.fillRect(0,92,VIEW_W,2);
  drawText(Game.level.bossIntro, VIEW_W/2, 66, '#ffe9e9', 12, true, true);
  drawText(Game.level.id+'  ·  FINAL BOSS', VIEW_W/2, 86, '#ff8a3a', 8, false, true);

}
function renderDone(){

  ctx.fillStyle='rgba(10,6,24,.80)'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  drawBigText('验收合格 JOB CLOSED', VIEW_W/2, 78);
  drawText('NO PARTS PENDING · 无遗留配件', VIEW_W/2, 120, '#8fe3b0', 12, true, true);

  drawText('ANODE RODS  '+Game.anodes, VIEW_W/2, 174, '#dfe8f2', 0, false, true);
  if(Math.floor(GamE_anim*2)%2===0) drawText('Press Enter / tap  ·  回到标题', VIEW_W/2, 232, '#8fa6d6', 12, true, true);
}
function renderLevel(){
  const L=Game.level; if(!L) return;
  drawParallax(L);
  // tiles
  const x0=Math.max(0,Math.floor(Camera.x/TILE)-1);
  const y0=Math.max(0,Math.floor(Camera.y/TILE)-1);
  const x1=Math.min(L.w, x0+SCREEN_TILES_W+3);
  const y1=Math.min(L.h, y0+SCREEN_TILES_H+3);
  for(let ty=y0;ty<y1;ty++)for(let tx=x0;tx<x1;tx++){
    drawTile(L,tx,ty);
  }
  // entities/items (stage 3+ will draw here)
  if(L.items) L.items.forEach(it=>drawItem(it));
  if(L.enemies) L.enemies.forEach(en=>{ if(en.type==='mouse'&&en.chewTimer>0){} if(typeof en.draw==='function')en.draw(); else {} });
  if(L.floats) L.floats.forEach(fl=>{ if(typeof fl.draw==='function')fl.draw(); });
  if(L.projectiles) L.projectiles.forEach(pr=>{ if(typeof pr.draw==='function')pr.draw(); });
  if(L.particles) L.particles.forEach(pa=>{ if(typeof pa.draw==='function')pa.draw(); });
  if(L._rocks) L._rocks.forEach(rk=>{
    if((rk.warn>>2)&1) return;
    const xx=Math.round(rk.x-Camera.x);
    ctx.fillStyle='#ff5a4a'; ctx.fillRect(xx+2,8,5,8);
    drawText('!',xx+1,15,'#fff');
  });
  if(L.npcs) L.npcs.forEach(np=>{ if(typeof np.draw==='function')np.draw(); });
  if(L.gadgets) L.gadgets.forEach(gd=>gd.draw());
  if(L.dumpRoom) drawDumpRoom(L);
  drawFlag(L);
  if(L.boss && typeof L.boss.draw==='function') L.boss.draw();
  if(Game.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(Game.flash)+')'; ctx.fillRect(0,0,VIEW_W,VIEW_H); Game.flash=Math.max(0,Game.flash-0.06); }
}
function drawParallax(L){
  const pal=L.palette;
  // sky gradient
  const g=ctx.createLinearGradient(0,0,0,VIEW_H);
  g.addColorStop(0,pal.sky0); g.addColorStop(1,pal.sky1);
  ctx.fillStyle=g; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  // far layer (karst peaks)
  ctx.fillStyle=pal.far;
  const off=(Camera.x*0.2)%256;
  for(let i=-1;i<VIEW_W/64+2;i++){
    const bx=i*64-off;
    drawPeak(bx, 96, 150, 44+ (i%3)*10);
  }
  // mid layer
  ctx.fillStyle=pal.mid;
  const off2=(Camera.x*0.5)%200;
  for(let i=-1;i<VIEW_W/80+2;i++){
    const bx=i*80-off2;
    drawHill(bx,150, 60);
  }
  // zone props (anchored, mid-parallax, culled)
  drawZoneProps(L);
  // water/ground strip
  ctx.fillStyle=pal.ground||pal.mid;
}
// deterministic seeded pseudo-random in [0,1) from an integer
function seeded(n){ const s=Math.sin(n*127.1+31.7)*43758.5453; return s-Math.floor(s); }
function drawZoneProps(L){
  if(!L.zone) return;
  const f=0.5;                       // mid-parallax factor
  const wpx=L.w*TILE;
  const base=150;                    // prop baseline y (screen)
  const step=120;
  for(let wx=60; wx<wpx+VIEW_W; wx+=step){
    const sx=wx*f - Camera.x*f;
    if(sx<-70||sx>VIEW_W+70) continue;
    const i=Math.round(wx/step), r=seeded(i+L.zone*57);
    const py=base-Math.round(r*18);      // slight height variation
    switch(L.zone){
      case 2: drawRigProp(sx,py,r); break;
      case 3: drawCamperProp(sx,py,r); break;
      case 4: drawContainerProp(sx,py,r); break;
      case 5: drawMarketProp(sx,py,r); break;
      case 6: drawPassProp(sx,py,r); break;
    }
  }
}
function drawRigProp(sx,py,r){
  // parked class-C rig: trailer + cab
  ctx.fillStyle='#5a6a7a'; ctx.fillRect(sx,py-14,44,14);
  ctx.fillStyle='#c9452f'; ctx.fillRect(sx+44,py-12,12,12);
  ctx.fillStyle='#2a3a4a'; ctx.fillRect(sx+47,py-10,7,5);
  ctx.fillStyle='#8a9aa8';
  ctx.beginPath(); ctx.arc(sx+8,py,3,0,7); ctx.arc(sx+34,py,3,0,7); ctx.arc(sx+50,py,3,0,7); ctx.fill();
  ctx.fillStyle='#dfeedd'; ctx.fillRect(sx+2,py-12,10,3);
}
function drawCamperProp(sx,py,r){
  // EV camper with light-blue badge
  ctx.fillStyle='#e8eef4'; ctx.fillRect(sx,py-16,40,16);
  ctx.fillStyle='#9fc0dd'; ctx.fillRect(sx,py-16,40,4);
  ctx.fillStyle='#2a4a6a'; ctx.fillRect(sx+4,py-10,10,7);
  ctx.fillStyle='#39424e';
  ctx.beginPath(); ctx.arc(sx+9,py,3,0,7); ctx.arc(sx+30,py,3,0,7); ctx.fill();
  ctx.fillStyle='#7fe8a8'; ctx.fillRect(sx+30,py-13,6,6);   // EV badge
  ctx.fillStyle='#1e5f3c'; ctx.fillRect(sx+32,py-11,2,2);
}
function drawContainerProp(sx,py,r){
  // stacked import containers
  const cs=['#c9452f','#2f6fb0','#3a8a5a','#e8a52b'];
  for(let k=0;k<3;k++){
    ctx.fillStyle=cs[(k+((r>0.5)?1:0))%4];
    ctx.fillRect(sx+(k%2)*4,py-14-k*13,44,12);
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(sx+(k%2)*4,py-14-k*13,44,2);
  }
  ctx.fillStyle='#111'; ctx.fillRect(sx+20,py-30,6,3);
}
function drawMarketProp(sx,py,r){
  // night-market stall with awning + a lantern
  ctx.fillStyle='#7a5a2a'; ctx.fillRect(sx+2,py-12,36,12);
  ctx.fillStyle=r>0.5?'#c93a1e':'#2f6fb0';
  for(let k=0;k<6;k++) ctx.fillRect(sx+k*7,py-16,5,4);
  ctx.fillStyle='#ffd266'; ctx.fillRect(sx+14,py-8,12,6);
  ctx.fillStyle='#c93a1e'; ctx.fillRect(sx+30,py-24,6,7);
  ctx.fillStyle='#ffd266'; ctx.fillRect(sx+31,py-23,4,4);
}
function drawPassProp(sx,py,r){
  // G318 switchback peak + prayer-flag string
  ctx.fillStyle='#8a97a8';
  ctx.beginPath();
  ctx.moveTo(sx-24,py); ctx.lineTo(sx,py-34); ctx.lineTo(sx+24,py); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e8eeF4'.toLowerCase(); ctx.beginPath();
  ctx.moveTo(sx-7,py-22); ctx.lineTo(sx,py-34); ctx.lineTo(sx+7,py-22); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#5a6a7a';                          // switchback road
  ctx.fillRect(sx-18,py-6,36,3);
  const cols=['#c93a1e','#2f6fb0','#e8e2d2','#3a8a5a','#e8a52b'];
  for(let k=0;k<5;k++){ ctx.fillStyle=cols[k]; ctx.fillRect(sx+16+k*7, py-18+(k%2?1:0), 5,4); }
  ctx.strokeStyle='#39424e'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx+14,py-16); ctx.lineTo(sx+52,py-14); ctx.stroke();
}
function drawPeak(x,baseY,h,w){
  ctx.beginPath();
  ctx.moveTo(x-w, baseY+h);
  ctx.lineTo(x, baseY);
  ctx.lineTo(x+w, baseY+h);
  ctx.closePath(); ctx.fill();
}
function drawHill(x,baseY,h){
  ctx.beginPath();
  ctx.ellipse(x, baseY+h, 55, h, 0, Math.PI, 0);
  ctx.fill();
}
function drawTile(L,tx,ty){
  const c=L.grid[ty][tx];
  const x=tx*TILE-Camera.x, y=ty*TILE-Camera.y;
  const pal=L.palette;
  if(c===' '||c==='.') return;
  if(c==='#'){
    ctx.fillStyle=pal.block; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle=pal.blockTop; ctx.fillRect(x,y,TILE,3);
    ctx.fillStyle=pal.blockShade; ctx.fillRect(x,y+TILE-2,TILE,2);
  } else if(c==='B'){
    ctx.fillStyle=pal.wood; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle=pal.woodShade; ctx.fillRect(x,y+4,TILE,1); ctx.fillRect(x,y+9,TILE,1);
    ctx.fillStyle=pal.woodEdge; ctx.fillRect(x,y,TILE,1);
  } else if(c==='?'){
    ctx.fillStyle='#e8a52b'; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle='#ffd266'; ctx.fillRect(x+1,y+1,TILE-2,TILE-2);
    ctx.fillStyle='#7a4b00';
    drawText('?',x+5,y+11,'#7a4b00');
  } else if(c==='^'||c==='='){
    ctx.fillStyle= pal.awning||'#dfeaf5'; ctx.fillRect(x,y,TILE,4);
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(x,y+4,TILE,1);
  } else if(c==='A'){
    ctx.fillStyle='#c98a3c'; ctx.fillRect(x,y+6,TILE,3);
    ctx.fillStyle='#8a5a20'; ctx.fillRect(x+2,y+8,3,6); ctx.fillRect(x+TILE-5,y+8,3,6);
    ctx.fillStyle='#ffd27a'; ctx.fillRect(x,y+5,TILE,2);
  } else if(c==='R'){
    ctx.fillStyle=pal.blockTop; ctx.beginPath();
    ctx.moveTo(x,y+TILE); ctx.lineTo(x+TILE,y); ctx.lineTo(x+TILE,y+TILE); ctx.closePath(); ctx.fill();
  } else if(c==='~'){
    ctx.fillStyle='rgba(80,160,220,.7)'; ctx.fillRect(x,y+3,TILE,TILE-3);
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(x,y+3,TILE,1);
  } else if(c==='W'){
    ctx.fillStyle='#6a4a2a'; ctx.fillRect(x,y+3,TILE,10);
    ctx.fillStyle='#3a2a1a'; ctx.fillRect(x,y+6,TILE,1); ctx.fillRect(x,y+11,TILE,1);
    ctx.fillStyle='#d84a2a'; ctx.fillRect(x,y+4,5,2);
    ctx.fillStyle='#f2c94c'; ctx.fillRect(x+TILE-5,y+4,5,2);
  } else if(c==='H'){
    const on=((Math.floor(GamE_anim*8)+tx*3+ty*5)%6)<4;
    ctx.fillStyle='#23232c'; ctx.fillRect(x,y+6,TILE,1); ctx.fillRect(x,y+9,TILE,1);
    ctx.fillStyle=on?'#ff8a1e':'#7a3a0a'; ctx.fillRect(x,y+7,TILE,2);
    if(on&&((tx*7+ty*13)%3===0)){ ctx.fillStyle='#ffd266'; ctx.fillRect(x+((tx*5+ty*3)%12),y+6,2,3); }
  } else if(c==='o'){
    ctx.fillStyle='#3a4a5a'; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle='#7fb2d8'; ctx.fillRect(x+2,y+2,12,12);
    ctx.fillStyle='#bfe0f0'; ctx.fillRect(x+3,y+3,10,3);
    ctx.fillStyle='#3a4a5a'; ctx.fillRect(x+7,y+2,2,12);
  } else if(c==='V'){
    ctx.fillStyle='#5a6a70'; ctx.fillRect(x+1,y+2,14,12);
    ctx.fillStyle='#1a2226'; ctx.fillRect(x+4,y+7,8,5);
    if((Math.floor(GamE_anim*3)+tx*7)%10<2){ ctx.fillStyle='#8bd'; ctx.fillRect(x+7,y+12,2,2); }
  } else if(c==='v'){
    ctx.fillStyle='#5a6a70'; ctx.fillRect(x+1,y+2,14,12);
    ctx.fillStyle='#8a9aa0'; ctx.fillRect(x+3,y+5,10,1); ctx.fillRect(x+3,y+9,10,1);
  } else if(c==='h'){
    ctx.fillStyle='#b84a2a'; ctx.fillRect(x+2,y+2,12,12);
    ctx.fillStyle='#e8e0c8'; ctx.fillRect(x+2,y+2,12,3);
    ctx.fillStyle='#3a1a12'; ctx.fillRect(x+5,y+9,3,4);
    if((Math.floor(GamE_anim*4)+tx)%5<2){ ctx.fillStyle='#fff'; ctx.fillRect(x+10,y+6,2,2); }
  } else if(c==='Q'){
    ctx.fillStyle='#bfe8f5'; ctx.fillRect(x,y,TILE,5);
    ctx.fillStyle='#8fc8e8'; ctx.fillRect(x,y+5,TILE,2);
    ctx.fillStyle='#e8f8ff'; ctx.fillRect(x+2,y+1,3,1); ctx.fillRect(x+10,y+2,2,1);
  } else if(c==='S'){
    // rooftop solar array: one-way sliding panel
    ctx.fillStyle='#2a3a5a'; ctx.fillRect(x,y+2,TILE,4);
    ctx.fillStyle='#3f5f9a'; ctx.fillRect(x+1,y+3,TILE-2,2);
    ctx.fillStyle='#8fb2ff'; ctx.fillRect(x+((tx*5)%10),y+3,2,2);
    ctx.fillStyle='#dfe8ff'; ctx.fillRect(x,y,TILE,1);
  } else if(c==='G'){
    // EV fast-charge pad
    const on=((Math.floor(GamE_anim*3)+tx)%6)<3;
    ctx.fillStyle=pal.block; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle=on?'#7fe8a8':'#3a8a5a'; ctx.fillRect(x+3,y+4,TILE-6,3);
    ctx.fillStyle='#eafff2'; ctx.fillRect(x+5,y+9,6,4);
    ctx.fillStyle='#2a5a3c'; ctx.fillRect(x+7,y+10,2,2);
  } else if(c==='C'){
    // charging-cable vine
    ctx.strokeStyle='#2a2a34'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x+8,y); ctx.quadraticCurveTo(x+12,y+8,x+6,y+16);
    ctx.stroke();
    ctx.fillStyle='#c93a1e'; ctx.fillRect(x+4,y+13,4,3);
  } else if(c==='U'){
    // hotpot steam updraft
    const k=(Math.floor(GamE_anim*4)+tx)%5;
    ctx.fillStyle='rgba(232,244,255,.35)';
    ctx.fillRect(x+3,y+12-k,4,4); ctx.fillRect(x+9,y+6-k,4,4);
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(x+5,y+1-k,2,2);
    ctx.fillStyle='#e8eaff'; ctx.fillRect(x,y+15,TILE,1);
  } else if(c==='L'){
    // lantern rope
    ctx.fillStyle='#5a4a3a'; ctx.fillRect(x,y,TILE,1);
    if(tx%2===0){
      ctx.fillStyle='#c93a1e'; ctx.fillRect(x+5,y+1,6,8);
      ctx.fillStyle='#ffd266'; ctx.fillRect(x+6,y+2,4,5);
      ctx.fillStyle='#8a2a18'; ctx.fillRect(x+7,y+8,2,2);
    }
  } else if(c==='q'){
    // QR toll-gate door
    ctx.fillStyle='#233044'; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle='#2f4058'; ctx.fillRect(x+2,y+2,TILE-4,TILE-4);
    ctx.fillStyle='#7ff0e8';
    ctx.fillRect(x+4,y+4,3,3); ctx.fillRect(x+9,y+5,3,2); ctx.fillRect(x+4,y+9,2,3); ctx.fillRect(x+9,y+10,2,2);
  } else if(c==='K'){
    // sea-freight parts crate
    ctx.fillStyle='#a07840'; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle='#7a5a30'; ctx.fillRect(x,y+TILE-2,TILE,2); ctx.fillRect(x,y,TILE,1);
    ctx.strokeStyle='#5a4020'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x+2,y+2); ctx.lineTo(x+14,y+14); ctx.moveTo(x+14,y+2); ctx.lineTo(x+2,y+14); ctx.stroke();
    ctx.fillStyle='#e8d5a8'; ctx.fillRect(x+4,y+6,8,4);
    drawText('件', x+6, y+10, '#5a4020', 8, true);
  }
}
function drawDumpRoom(L){
  const d=L.dumpRoom; if(!d) return;
  const x=Math.round(d.x-Camera.x), y=Math.round(d.y-Camera.y);
  if(x<-40||x>VIEW_W+40) return;
  // pipe run
  ctx.fillStyle='#5a6a70'; ctx.fillRect(x-10,y+8,96,5);
  ctx.fillStyle='#42505a'; ctx.fillRect(x-10,y+8,96,2);
  const valve=(vx,c1,c2,label,on)=>{
    ctx.fillStyle=c1; ctx.beginPath(); ctx.arc(vx+5,y+10,7,0,7); ctx.fill();
    ctx.fillStyle=c2;
    ctx.fillRect(vx+4,y+3,2,7); ctx.fillRect(vx-1,y+6,12,2);
    drawText(label, vx-6, y-6, '#e8f4ff', 8, true);
    if(on) drawText('✓', vx, y+24, '#8fe3b0');
  };
  valve(x, '#23232c', d.black?'#8fe3b0':'#556', '黑水', d.black);
  valve(x+56, '#5c6a72', d.solved?'#8fe3b0':'#9ab', '灰水', d.solved);
  // nozzle + flow state
  ctx.fillStyle='#3a4650'; ctx.fillRect(x+80,y+6,8,10);
  if(d.solved){
    const f=Math.floor(d.t/3)%4;
    ctx.fillStyle='#9fd8c8'; ctx.fillRect(x+86,y+8+f,3,6);
    if(d.t%6===0) spawnParticlesL(L, x+88, y+12, '#9fd8c8');
  }
  if(d.flood>0){
    ctx.fillStyle='rgba(150,170,160,.5)';
    for(let i=0;i<10;i++){ const fx=(i*13+d.t*2)%96; ctx.fillRect(x-8+fx, y+14+((i*7)%6), 3,3); }
  }
  if(!d.solved&&!d.failed&&Game.player&&!Game.player.dead){
    const p=Game.player;
    if(Math.abs((p.x+p.w/2)-(d.x+5))<20||Math.abs((p.x+p.w/2)-(d.x+61))<20)
      drawText('X 拉杆 PULL', x+20, y-18, '#ffd266');
  }
}

function drawItem(it){
  const x=Math.round(it.x-Camera.x), y=Math.round(it.y-Camera.y);
  switch(it.type){
    case 'anode':
      it.t=(it.t||0)+0.15;
      const s=Math.abs(Math.cos(it.t))*4+2;
      ctx.fillStyle='#9fb2c4'; ctx.fillRect(x,y+3, s,9);
      ctx.fillStyle='#dfe8f2'; ctx.fillRect(x,y+3, s,1);
      break;
    case 'sealant':
      ctx.fillStyle='#fff'; ctx.fillRect(x,y,12,7); ctx.fillStyle='#c33'; ctx.fillRect(x,y,12,2);
      ctx.fillStyle='#888'; ctx.fillRect(x+12,y+2,3,3); break;
    case 'torque':
      ctx.fillStyle='#666'; ctx.fillRect(x,y+4,12,3); ctx.fillStyle='#f2c94c'; ctx.fillRect(x,y+2,5,7); break;
    case 'cee':
      ctx.fillStyle='#1e5fff'; ctx.fillRect(x,y,11,11); ctx.fillStyle='#bcd';
      ctx.fillRect(x+3,y+3,2,2); ctx.fillRect(x+7,y+3,2,2); break;
    case 'surge':
      ctx.fillStyle='#33d17a'; ctx.fillRect(x,y,11,11); ctx.fillStyle='#fff'; drawText('EMS',x+1,y+8,'#fff');break;
    case 'shield':
      ctx.fillStyle='#fff'; ctx.fillRect(x,y,11,11); ctx.strokeStyle='#222'; ctx.strokeRect(x+1,y+1,9,9); break;
    case 'mooncake':
      ctx.fillStyle='#e9c26a'; ctx.beginPath(); ctx.arc(x+5,y+5,5,0,7); ctx.fill();
      ctx.fillStyle='#c79a3f'; ctx.beginPath(); ctx.arc(x+5,y+5,3,0,7); ctx.fill(); break;
    case 'order':
      ctx.fillStyle='#fff'; ctx.fillRect(x,y,9,11); ctx.fillStyle='#333'; ctx.fillRect(x+2,y+2,5,1); ctx.fillRect(x+2,y+4,5,1);
      drawText('单',x+1,y+10,'#c0392b',8,true); break;
    case 'oneup':
      drawText('验收合格',x-4,y+8,'#e74c3c',8,true); break;
    case 'impact':
      ctx.fillStyle='#222'; ctx.fillRect(x,y+4,12,4); ctx.fillStyle='#0ff'; ctx.fillRect(x+10,y+3,3,6); break;
    case 'tea':
      ctx.fillStyle='#8a4b2a'; ctx.fillRect(x+2,y,8,11); ctx.fillStyle='#cfe'; ctx.fillRect(x+2,y,8,2); break;
    case 'grease':
      ctx.fillStyle='#c8c255'; ctx.fillRect(x,y+3,12,8); ctx.fillStyle='#333'; ctx.fillRect(x,y+3,12,2); break;
    case 'part':
      // imported spare part: bolt in a blue box
      it.t=(it.t||0)+0.1;
      const bob=Math.sin(it.t)*2;
      ctx.fillStyle='#2f4a6a'; ctx.fillRect(x,y+6+bob,12,7);
      ctx.fillStyle='#8fb2ff'; ctx.fillRect(x+2,y+4+bob,8,4);
      ctx.fillStyle='#dfe8f2'; ctx.beginPath(); ctx.arc(x+6,y+9+bob,3,0,7); ctx.fill();
      ctx.fillStyle='#39424e'; ctx.fillRect(x+5,y+8+bob,2,2); break;
  }
}

  // anodes
  ctx.fillStyle='#9fb2c4'; ctx.fillRect(120,6,7,9);
  drawText('×'+Game.anodes, 130, 14, '#dfe8f2');
  // power badge
  const badge = Game.power===2?'220V • 32A': Game.power===1?'220V • 16A':'APPRENTICE';
  ctx.fillStyle= Game.power===2? '#1e5fff': Game.power===1? '#2f6fb0':'#444';
  ctx.fillRect(190,5,72,12);

  // arc meter (visibly doubles in capacity/width at 32A)
  const mw = Game.power===2? 72:36;
  ctx.fillStyle='#111'; ctx.fillRect(190,19,mw,3);
  ctx.fillStyle= Game.power===2? '#6cf':'#48a';
  ctx.fillRect(190,19,mw*(Game.arcMeter/Game.arcMax),3);

  const zl = Game.zoneLevels[Game.levelIndex]||[];

  // timer
  drawText(String(Math.max(0,Math.ceil(Game.timer))).padStart(3,'0'), VIEW_W-40, 24, '#ffd266');

  drawTankMonitor(8, 30);
}
function drawTankMonitor(x,y){
  // 清水/灰水/黑水 tank monitor: the score-multiplier panel, styled after the
  // notoriously unreliable real sensors. It occasionally misreads (glitches to
  // "all full") — cosmetic only, never changes actual gameplay data.
  const glitch = ((Game.timer*7)|0)%97===0;
  const on = glitch? [true,true,true] : [Game.multiplier>=1, Game.multiplier>=2, Game.multiplier>=3];
  const cols=['#39c','#886','#444'];
  on.forEach((lit,i)=>{
    ctx.fillStyle= lit? cols[i] : '#223';
    ctx.fillRect(x+i*12,y,9,6);
  });
  drawText('×'+Game.multiplier, x+38, y+6, '#ffd266');
  drawText('FRESH·GRAY·BLACK', x, y+12, glitch? '#fd8': '#567', 0);
}

function renderMap(){
  const t=performance.now()/1000;
  const cx=250, cy=184, rx=198, ry=58;
  ctx.fillStyle='#0d1524'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  const g=ctx.createLinearGradient(0,0,0,116);
  g.addColorStop(0,'#241f3f'); g.addColorStop(1,'rgba(13,21,36,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,VIEW_W,116);
  // G318 mountain cluster top-right
  ctx.fillStyle='#20293d';
  for(let i=0;i<6;i++) drawPeak(356+i*24, 40, 20+i*7, 15+i*4);
  drawText('G318 高路 G318', 416, 60, '#9fc4e8', 0, true, true);
  // campground loop road
  ctx.strokeStyle='#2b3448'; ctx.lineWidth=16; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  for(let i=0;i<=72;i++){const a=i/72*2*Math.PI;const nx=cx+rx*Math.cos(a),ny=cy+ry*Math.sin(a); i?ctx.lineTo(nx,ny):ctx.moveTo(nx,ny);}
  ctx.closePath(); ctx.stroke();
  // center camp
  drawText('营地', cx, cy-3, '#6a7a9a', 11, true, true);
  drawText('CAMP LOOP', cx, cy+14, '#465170', 0, false, true);
  // G318 spur from the pass site to the peaks
  let gi=0; for(let i=0;i<LEVELS.length;i++) if(LEVELS[i].zone===6) gi=i;
  const ga=gi/LEVELS.length*2*Math.PI;
  const sx=cx+rx*Math.cos(ga), sy=cy+ry*Math.sin(ga);
  ctx.save(); ctx.setLineDash([3,4]); ctx.strokeStyle='#79a6d8'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(400,86,404,54); ctx.stroke(); ctx.restore();
  // sites
