// ===== SECTION: GAME STATE & MAIN LOOP =================
let last=0, acc=0;
const STEP=1/60;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts;
  if(dt>0.25) dt=0.25;
  acc+=dt;
  while(acc>=STEP){ update(STEP); acc-=STEP; GamE_anim+=STEP; }
  render();
}
function update(dt){
  if(Game.state==='play'){
    if(Game._introT>0) Game._introT--;
    Game.timer-=dt;
    if(Game.timer<=0 && !Game.player.dead){ killPlayer(Game.player,'time'); }
    Input.update();
    updatePlayer(Game.player,Game.level,dt);
    updateEntities(dt);
    Camera.update(Game.player.x,Game.player.y,Game.player.w,Game.player.h,Game.level.widthPx,Game.level.heightPx);
    if(Game.level.auto){
      // Zone 6 high pass: the convoy rolls on a slow idle, and surges hard
      // during the whiteout gust fronts (same 260-frame weather cycle)
      const _p=Game.player;
      Game.level._autoT=(Game.level._autoT||0)+dt*60;
      const _cyc=(Game.level._wT||0)%260;
      const _push=(_cyc>=150&&_cyc<200)?1.6:0.45;
      Game.level._autoX=Math.max(Game.level._autoX||0, Camera.x)+_push;
      if(Camera.x<Game.level._autoX) Camera.x=Game.level._autoX;
      if(_p&&!_p.dead && _p.x < Camera.x-16) killPlayer(_p,'shoved');
    }
    if(Game.shake>0)Game.shake--;
    const L=Game.level;
    if(L.flag && !L.cleared && rectHit(Game.player, L.flag.x*TILE, L.flag.y*TILE, 16, 60)) onLevelClear();
  } else if(Game.state==='title'){
    if(keysPressedEnter() || (Input.isTouch && Input.jump)) startFromTitle();
  } else if(Game.state==='clear'){
    Game._clearT=(Game._clearT||0)+dt;
    if(Game._clearT>2.3 || (keysPressedEnter() && Game._clearT>0.6) || (Input.isTouch && Input.jump && Game._clearT>0.3)) advanceLevel();
  } else if(Game.state==='map'){
    Game._mapT=(Game._mapT||0)+dt;
    if(Game._mapT>1.8 || keysPressedEnter() || (Input.isTouch && Input.jump && Game._mapT>0.15)){
      Game._mapT=0;
      const n=Game._mapNext; Game._mapNext=null;
      if(n!=null) loadLevel(n);
      Game.state='play';
    }
  } else if(Game.state==='done'){
    if(keysPressedEnter() || (Input.isTouch && Input.jump)){ Game.state='title'; }
  } else if(Game.state==='over'){
    if(keysPressedEnter() || (Input.isTouch && Input.jump)){ Game.state='title'; }
  }
}
function advanceLevel(){
  Game._clearT=0;
  const next=Game.levelIndex+1;
  if(next<LEVELS.length){ Game._mapNext=next; Game.state='map'; Game._mapT=0; }
  else { Game.state='title'; AudioEngine.stopMusic(); }
}
function keysPressedEnter(){
  const k=Input.keys['pause'];
  const r=!!k && !Game._enterHeld;
  Game._enterHeld=!!k;
  return r;
}
function rectHit(p,rx,ry,rw,rh){
  return p.x < rx+rw && p.x+p.w > rx && p.y < ry+rh && p.y+p.h > ry;
}
function updateEntities(dt){
  const L=Game.level; if(!L) return;
  if(L.items) itemsUpdate(L,dt);
  if(L.enemies) enemiesUpdate(L,dt);
  if(L.floats) floatsUpdate(L,dt);
  if(L.projectiles) projectilesUpdate(L,dt);
  if(L.particles) particlesUpdate(L,dt);
  if(L.npcs) npcsUpdate(L,dt);
  if(L.gadgets) gadgetUpdate(L,dt);
  qrScanUpdate(L);
  if(L.auto) weatherUpdate(L,dt);
  if(L.dumpRoom) dumpUpdate(L,dt);
  if(L.boss && typeof L.boss.update==='function') L.boss.update(dt);
}
// pedestal checkpoints: walk up to plug in (saves progress), 32A posts refill
// the arc meter faster at tier 3 — mirroring the real 16A/32A service gap
// Dump Point bonus room: valve-order puzzle. The real rule — open the BLACK
// (黑水) valve first, then GRAY (灰水), so gray water rinses out the hose.
// Wrong order floods the room with gray water and forfeits the payout.
function dumpUpdate(L,dt){
  const d=L.dumpRoom; if(!d) return;
  d.t++;
  if(d.flood>0) d.flood--;
  if(d.solved||d.failed) return;
  const p=Game.player;
  if(!p||p.dead) return;
  const pull=(lx,which)=>{
    const dx=(p.x+p.w/2)-lx, dy=(p.y+p.h/2)-(d.y+9);
    if(Math.abs(dx)<16 && Math.abs(dy)<30 && Input.wrenchJustPressed){
      if(which==='black' && !d.black){
        d.black=true;
        AudioEngine.sfx('valve');
        spawnFloatFx('黑水 BLACK ✓', lx-12, d.y-26, '#dfe8f2');
      } else if(which==='gray'){
        if(d.black){
          d.solved=true;
          AudioEngine.sfx('reward');
          spawnFloatFx('冲洗 RINSED +30', lx-20, d.y-30, '#8fe3b0');
          for(let i=0;i<30;i++){
            const it=makeItem('anode', lx-30+((i*7)%60), d.y-38-((i*13)%40));
            it.vy=-2-((i*5)%30)/10; L.items.push(it);
          }
        } else {
          d.failed=true; d.flood=240;
          AudioEngine.sfx('flood');
          spawnFloatFx('BLACK FIRST! 黑水先开', lx-24, d.y-30, '#ff9a8a');
        }
      }
    }
  };
  pull(d.x+5,'black');
  pull(d.x+61,'gray');
}
function npcsUpdate(L,dt){
  const p=Game.player; if(!p||p.dead) return;
  for(const np of L.npcs){
    if(np.pulse>0) np.pulse--;
    if(np.type==='pedestal'){
      const dx=(p.x+p.w/2)-(np.x+7), dy=(p.y+p.h)-(np.y+2);
      if(Math.abs(dx)<16 && dy>-20 && dy<26){
        if(!np.used){
          np.used=true; np.pulse=90;
          p.checkpoint={x:Math.round(np.x/TILE), y:Math.round(np.y/TILE)-1};
          AudioEngine.sfx('checkpoint');
          spawnFloatFx('checkpoint', np.x-8, np.y-32, '#7ff0e8');
        } else if(Game.power===2){
          Game.arcMeter=Math.min(Game.arcMax, Game.arcMeter+(np.a===32?0.45:0.16));
        }
      }
    } else if(np.type==='charger'){
      // EV fast-charge bank: stands fully refill the arc-flash meter
      const dx=Math.abs((p.x+p.w/2)-(np.x+10)), dy=Math.abs((p.y+p.h/2)-(np.y-6));
      if(dx<26 && dy<40 && Game.power>0){
        Game.arcMeter=Math.min(Game.arcMax, Game.arcMeter+0.9);
        if((np.t|0)%5===0) spawnParticles(np.x+10, np.y-10, 1, '#6cf', {up:1.4});
      }
    }
  }
}

// ===== GADGETS (zone-5/6 gimmicks, see-saws, gates, elevators) =====
// QR toll gate: a close scan with the wrench opens the run
function scanGate(L,p){
  const cx=(p.x+p.w/2)/TILE, cy=(p.y+p.h/2)/TILE;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const tx=Math.floor(cx)+dx, ty=Math.floor(cy)+dy;
    if(tlChar(L,tx,ty)!=='q') continue;
    const tiles=[];
    for(let yy=ty-1;yy>=0;yy--) if(tlChar(L,tx,yy)==='q') tiles.push({tx,ty:yy});
    for(let yy=ty;yy<L.h;yy++) if(tlChar(L,tx,yy)==='q') tiles.push({tx,ty:yy});
    return {tiles, t:0, x:tx*TILE+8, y:ty*TILE};
  }
  return null;
}
function qrScanUpdate(L){
  const qr=Game.qr;
  if(!qr) return;
  qr.t++;
  if((qr.t&1)===0) spawnParticles(qr.x, qr.y+6, 1, '#7ff0e8', {up:0.5, life:0.3});
  if(qr.t>=45){
    for(const tt of qr.tiles){
      L.grid[tt.ty][tt.tx]=' ';
      spawnParticles(tt.tx*TILE+8, tt.ty*TILE+4, 6, '#7ff0e8', {up:0.9});
    }
    AudioEngine.sfx('qrgate');
    spawnFloatFx('扫码通过 SCAN OK', qr.x-16, qr.y-18, '#7ff0e8');
    Game.qr=null;
  }
}
function gadgetUpdate(L,dt){
  if(!L.gadgets||!L.gadgets.length) return;
  const p=Game.player;
  for(const g of L.gadgets){
    g.t=(g.t||0)+1;
    if(g.type==='seesaw'){
      g.angle=Math.sin(g.t*0.045)*0.26;
      if(p&&!p.dead){
        // one-way plank: recatch the feet on the tilted board every frame
        const cxp=g.x+g.w/2, pivY=g.y+4;
        const fx=p.x+p.w/2;
        if(Math.abs(fx-cxp)<g.w/2-4 && p.vy>=-0.5){
          const yy=pivY+(fx-cxp)*Math.tan(g.angle);
          if(p.y+p.h>=yy-3 && p.y+p.h<=yy+8){
            p.y=yy-p.h; p.vy=0; p.onGround=true;
            p.coyote=Math.max(p.coyote,5);
          }
        }
      }
    } else if(g.type==='partgate'){
      if(!g.opened && L._part){
        g.opened=true;
        AudioEngine.sfx('qrgate');
        spawnFloatFx('配件已认 PART OK', g.x-8, g.y-10, '#ffd266');
      }
      if(!g.opened && p&&!p.dead && rectHit(p, g.x, g.y, g.w, g.h)){
        if(p.x+p.w/2 < g.x+g.w/2) p.x=g.x-p.w-0.01; else p.x=g.x+g.w+0.01;
        p.vx=0;
        if(g.cd<=0){ AudioEngine.sfx('clang'); g.cd=20; spawnFloatFx('要备件 PART NEEDED', g.x-12, g.y-8, '#ff9a8a'); }
      }
      if(g.cd>0) g.cd--;
    } else if(g.type==='sitecheck'){
      // camp site-check kiosk: a 4-step key checklist, no damage on a slip
      if(g.qte){
        g.qte.stepT--;
        const seq=['left','right','up','down'];
        if(Input.keys[seq[g.qte.step]]){
          g.qte.step++;
          g.qte.stepT=72;
          AudioEngine.sfx('checkpoint');
          if(g.qte.step>=4){
            g.qte=null; g.done=true;
            Game.anodes+=25;
            AudioEngine.sfx('reward');
            spawnFloatFx('营位检查合格 +25', g.x-14, g.y-30, '#8fe3b0');
          }
        } else if(g.qte.stepT<=0){
          g.qte.step=0; g.qte.stepT=72;
          AudioEngine.sfx('spark');
        }
      } else if(!g.done && p&&!p.dead){
        if(Math.abs((p.x+p.w/2)-(g.x+8))<22 && Math.abs((p.y+p.h/2)-(g.y-6))<30 && Input.wrenchJustPressed){
          g.qte={step:0, stepT:72};
          AudioEngine.sfx('order');
          spawnFloatFx('营位检查 SITE CHECK', g.x-16, g.y-30, '#ffd266');
        }
      }
    } else if(g.type==='tunnel'){
      if(g.cd>0) g.cd--;
      if(p&&!p.dead && g.cd<=0){
        const pcx=p.x+p.w/2;
        if(pcx>g.x && pcx<g.x+g.w){
          if(!p.crouch){
            g.cd=120;
            if(Game.power>0) Game.power--;
            p.invuln=Math.max(p.invuln,60);
            spawnFloatFx('擦到空调 SHRED!', pcx-20, p.y-12, '#ff9a8a');
            spawnParticles(pcx, p.y, 14, '#cfe8ff', {sp:2, up:1.2});
            AudioEngine.sfx('trip');
            Game.shake=Math.max(Game.shake,5);
            hurtPlayerFn(p,1);
          } else if((g.t&7)===0){
            spawnParticles(pcx, g.y-20, 1, '#e8f4ff', {up:0.4, life:0.3});
          }
        }
      }
    } else if(g.type==='lift'){
      // scissor-jack lift: catch the deck from above, crank it with the wrench
      if(p&&!p.dead){
        const onX=Math.abs((p.x+p.w/2)-(g.x+g.w/2))<g.w/2+4;
        if(onX && p.vy>=-0.5 && p.y+p.h>=g.y-4 && p.y+p.h<=g.y+10){
          p.y=g.y-p.h; p.vy=0; p.onGround=true;
          p.coyote=Math.max(p.coyote,5);
        }
        if(onX && Math.abs((p.y+p.h)-g.y)<4){
          const rate=(p.impact>0?1.0:0.5);
          if(Input.wrench){ g.y=Math.max(g.baseY-64, g.y-rate); if((g.t&2)===0) spawnParticles(g.x+g.w/2, g.y, 1, '#cfd6e0', {up:0.8}); }
          else if(Input.down){ g.y=Math.min(g.baseY, g.y+rate); }
          p.y=g.y-p.h; p.vy=0;
        } else if(g.y<g.baseY){
          g.y=Math.min(g.baseY, g.y+0.4);
        }
      }
    } else if(g.type==='spinner'){
      // tire balancer: a deck sweeping a circle, one-way from above
      const a=g.t*0.02;
      g.px=g.cx+Math.cos(a)*g.r; g.py=g.cy+Math.sin(a)*g.r*0.55;
      if(p&&!p.dead && p.vy>=0 && !p.onGround){
        const dw=26;
        if(Math.abs((p.x+p.w/2)-g.px)<dw/2 && p.y+p.h>=g.py-2 && p.y+p.h<=g.py+8){
          p.y=g.py-p.h-0.01; p.vy=0; p.onGround=true;
        }
      }
    }
  }
}
// Z6 high-pass weather: boulders off the scree slope, whiteout gust fronts
function weatherUpdate(L,dt){
  const p=Game.player; if(!p) return;
  L._wT=(L._wT||0)+1;
  // rockfall: warn marker on the road, then the boulder itself
  L._rockT=(L._rockT||0)-1;
  if(L._rockT<=0 && p.x>L.widthPx*0.25){
    L._rockT=60+((Math.random()*80)|0);
    L._rocks=L._rocks||[];
    L._rocks.push({x:Camera.x+60+Math.random()*340, warn:36});
  }
  L._rocks=L._rocks||[];
  for(let i=L._rocks.length-1;i>=0;i--){
    const rk=L._rocks[i];
    rk.warn--;
    if(rk.warn<=0){
      L.projectiles.push({x:rk.x, y:-10, w:9, h:9, vx:-0.2, vy:2.8, grav:false, t:0, life:150, kind:'rock', draw:fn_rockdraw});
      L._rocks.splice(i,1);
      AudioEngine.sfx('rockfall');
    }
  }
  // whiteout gust fronts (streaks warn 5 frames before the push + surge)
  const cyc=L._wT%260;
  if(cyc>=145 && cyc<210){
    if(cyc===150) AudioEngine.sfx('gust');
    if(cyc>=150) p.vx-=0.09;
    if((L._wT&3)===0){
      const wy=Math.random()*VIEW_H;
      L.particles.push({x:Camera.x+VIEW_W+4, y:wy, vx:-7-Math.random()*3, vy:0, t:0, life:0.5, color:'#eaf2fc', draw:fn_streak});
    }
  }
}
function fn_streak(){
  const pa=this;
  ctx.globalAlpha=Math.max(0,0.7*(1-pa.t/pa.life));
  ctx.fillStyle=pa.color;
  ctx.fillRect(Math.round(pa.x-Camera.x), Math.round(pa.y-Camera.y), 16, 1);
  ctx.globalAlpha=1;
}
function fn_rockdraw(){
  const pr=this, x=Math.round(pr.x-Camera.x), y=Math.round(pr.y-Camera.y);
  ctx.fillStyle='#7a8aa0'; ctx.fillRect(x,y,9,9);
  ctx.fillStyle='#9fb4d6'; ctx.fillRect(x+1,y+1,3,3);

}
function fn_gadgetdraw(){
  const g=this, x=Math.round(g.x-Camera.x), y=Math.round(g.y-Camera.y);
  if(x<-200||x>VIEW_W+200) return;
  const camY=Camera.y;
  if(g.type==='seesaw'){
    const cx=x+g.w/2, dx=g.w/2;
    // pivot post (down into the pit)
    ctx.fillStyle='#6a5a4a';
    ctx.fillRect(cx-3, y+6, 6, 26);
    // plank
    ctx.save();
    ctx.translate(cx, y+4);
    ctx.rotate(g.angle);
    ctx.fillStyle='#c8914f'; ctx.fillRect(-dx, -2, g.w, 5);
    ctx.fillStyle='#8a5e34'; ctx.fillRect(-dx, 2, g.w, 2);
    ctx.restore();

function itemsUpdate(L,dt){
  const p=Game.player;
  for(let i=L.items.length-1;i>=0;i--){
    const it=L.items[i]; if(!it.active) continue;
    it.t+=dt*6;
    // fall + land (one-ways land, bounce pads hop, solids land)
    if(!it.grounded){
      if(it.vy===undefined) it.vy=0;
      it.vy=Math.min(6,it.vy+0.28);
      const prevFeet=it.y+7;
      it.y+=it.vy;
      const feet=it.y+7;
      const txa=Math.floor((it.x+1)/TILE), txb=Math.floor((it.x+11)/TILE);
      const tyf=Math.floor(feet/TILE);
      let landed=false;
      for(let tx=txa;tx<=txb;tx++){
        if(isSolid(L,tx,tyf)){ it.y=tyf*TILE-7; it.vy=0; it.grounded=true; landed=true; break; }
        if(isOneWay(L,tx,tyf) && it.vy>=0 && prevFeet<=tyf*TILE+2 && feet>=tyf*TILE){ it.y=tyf*TILE-7; it.vy=0; it.grounded=true; landed=true; break; }
        if(isBounce(L,tx,tyf) && it.vy>=0 && feet>=tyf*TILE){ it.y=tyf*TILE-7; it.vy=-4.5; }
      }
      if(landed && L.particles){}
    }
    if(p && !p.dead && it.type!=='order'){
      const dx=(p.x+p.w/2)-(it.x+5), dy=(p.y+p.h/2)-(it.y+5);
      if(Math.abs(dx)<11 && Math.abs(dy)<13){
        applyItem(it); it.active=false; L.items.splice(i,1);
      }
    } else if(p && !p.dead && it.type==='order'){
      const dx=(p.x+p.w/2)-(it.x+5), dy=(p.y+p.h/2)-(it.y+8);
      if(Math.abs(dx)<12 && Math.abs(dy)<15){
        applyItem(it); it.active=false; L.items.splice(i,1);
      }
    }
  }
}
function applyItem(it){
  const p=Game.player;
  AudioEngine.sfx('anode');
  switch(it.type){
    case 'anode':
      Game.anodes++;
      if(Game.anodes>=100){ Game.anodes-=100; Game.lives++; AudioEngine.sfx('life'); }
      break;
    case 'mooncake': Game.anodes+=5; break;
    case 'sealant':
      // self-leveling roof sealant: worth 10, and you now carry a tube to throw
      Game.anodes+=10;
      p.seal=Math.min(3,(p.seal||0)+1);
      spawnFloatFx('封胶 SEALANT +'+p.seal, p.x-6, p.y-8, '#eef8ff');
      break;
    case 'torque': Game.power=Math.max(1,Game.power); growPlayer(); break;
    case 'cee': Game.power=Math.max(2,Game.power); growPlayer(); AudioEngine.sfx('power2'); break;
    case 'oneup': Game.lives++; AudioEngine.sfx('life'); break;
    case 'surge': p.surge=Math.max(p.surge, 300); p.invuln=Math.max(p.invuln,300); AudioEngine.sfx('power2'); break;
    case 'shield': p.shield=true; break;
    case 'impact': p.impact=Math.max(p.impact, 20*60); AudioEngine.sfx('impact'); break;
    case 'tea': Game.arcMeter=Game.arcMax; p.coldImmune=Math.max(p.coldImmune||0, 10*60); break;
    case 'part':
      // imported part: opens the part-gate checkpoint
      Game.level._part=true;
      spawnFloatFx('备件到手 PART GOT', p.x-14, p.y-10, '#ffd266');
      AudioEngine.sfx('qrgate');
      break;
    case 'grease': p.slide=Math.max(p.slide||0, 30*60); p.invuln=Math.max(p.invuln,30); AudioEngine.sfx('slide'); break;
    case 'order': recordServiceOrder(); break;
  }
}

const ENEMY_DEF = {
  goblin:   {w:12,h:12, melee:1, slide:1, stomp:1},        // 漏水精 leak goblin
  blob:     {w:13,h:11, melee:1, slide:1, stomp:1},        // delam blob (absorbs goblins)
  crusher:  {w:30,h:16, motor:1},                          // slide-out: stomp/wrench the motor
  screamer: {w:16,h:12, slide:1, arc:1, clang:1},          // bearing screamer (wrench-proof)
  miswired: {w:14,h:18, surge:1},                 // miswired pedestal (surge grounds it; touch = damage)
  serpent:  {w:13,h:14, arc:1, stompSeg:1},                // sewer serpent (segment by segment)
  mouse:    {w:10,h:8,  melee:1, slide:1, arc:1, stomp:1, chew:1}, // mouse pack (chews wiring)
  gascloud: {w:16,h:12, arc:'x'},                          // gas cloud (arc-flash ignites it)
  betty:    {w:14,h:14, melee:1, stomp:1},                 // blowout betty (stomp before it inflates)
  scalper:  {w:14,h:20, melee:1, slide:1, arc:1, stomp:1, paper:1}, // The Scalper (throws receipts)
  wraith:   {w:14,h:18, thaw:1, frost:1},                  // freeze wraith (water-heater thaws it)
  yak:      {w:26,h:18, neutral:1},                        // G318 cross-lane yak (invulnerable plod)
  wave:     {w:14,h:26, neutral:1},                        // square-dance dancer (sweeping, contact)
};
function makeEnemy(kind,x,y,opt){
  opt=opt||{};
  const d=ENEMY_DEF[kind];
  const en={ kind, type:kind, x, y, w:d.w, h:d.h, vx:0, vy:0, t:0, f:opt.facing||-1, hp:1,
             dead:false, chewTimer:0, draw:fn_enemydraw };
  if(kind==='serpent'){ en.segs=5; en.hitbox=null; en.baseY=y+d.h; en.rise=0; }
  if(kind==='crusher'){
    en.x0=x; en.bx=x; en.by=y; en.dir=opt.dir||1;
    en.motorX=en.dir>0? x-11 : x+33; en.motorY=y+5;
    en.phase=0; en.ct=0; en.parked=false;
  }
  if(kind==='gascloud'){ en.seed=opt.seed!==undefined?opt.seed:Math.random()*6; en.life=opt.life||600; }
  if(kind==='scalper'){ en.x0=x; en.aimT=0; }
  if(kind==='blob'){ en.phase='swell'; en.phaseT=0; }
  if(kind==='yak'){ en.x0=x; en.rng=opt.rng!==undefined?opt.rng:48; en.spd=opt.spd||0.32; en.bellT=0; }
  if(kind==='wave'){ en.x0=x; en.rng=opt.rng!==undefined?opt.rng:40; en.baseY=y; }
  return en;
}
function enRect(en){
  if(en.dead) return null;
  switch(en.kind){
    case 'serpent': return en.hitbox;
    case 'blob': return en.phase==='swell'? null : {x:en.x,y:en.y,w:en.w,h:en.h};
    case 'crusher': return en.parked? null : {x:en.bx,y:en.by,w:30,h:16};
    case 'betty': { const big=en.t>=120; return {x:en.x-2,y:en.y-(big?4:0),w:en.w+4,h:en.h+(big?4:0)}; }
    default: return {x:en.x,y:en.y,w:en.w,h:en.h};
  }
}
function edgeAhead(L,en){
  const tx=Math.floor((en.f>0? en.x+en.w+2 : en.x-2)/TILE);
  const ty=Math.floor((en.y+en.h+2)/TILE);
  return !isSolid(L,tx,ty)&&!isOneWay(L,tx,ty);
}
function moveEnemy(L,en){
  en.vy=Math.min((en.vy||0)+0.3, MAX_FALL);
  en.x+=en.vx;
  en.blocked=false;
  let hit=solidAt(L,{x:en.x,y:en.y,w:en.w,h:en.h});
  if(hit){
    if(en.vx>0) en.x=hit.tx*TILE-en.w-0.01;
    else if(en.vx<0) en.x=(hit.tx+1)*TILE+0.01;
    en.vx=0; en.blocked=true;
  }
  const feetPrev=en.y+en.h;
  en.y+=en.vy;
  en.onG=false;
  hit=solidAt(L,{x:en.x,y:en.y,w:en.w,h:en.h});
  if(hit){
    if(en.vy>0){ en.y=hit.ty*TILE-en.h-0.01; en.vy=0; en.onG=true; }
    else { en.y=(hit.ty+1)*TILE+0.01; en.vy=0; }
  }
  if(en.vy>=0){
    const ty=Math.floor((en.y+en.h)/TILE);
    const tx0=Math.floor((en.x+1)/TILE), tx1=Math.floor((en.x+en.w-1)/TILE);
    for(let tx=tx0;tx<=tx1;tx++){
      if(isOneWay(L,tx,ty)){
        const top=ty*TILE;
        if(feetPrev<=top+1 && en.y+en.h>=top){ en.y=top-en.h-0.01; en.vy=0; en.onG=true; }
      }
    }
  }
}
function updateEnemy(L,en){
  en.t++;
  const p=Game.player;
  switch(en.kind){
    case 'goblin': {
      if(en.turnCd>0) en.turnCd--;
      if((en.blocked||edgeAhead(L,en))&&en.turnCd===0){ en.f*=-1; en.turnCd=30; }
      en.vx=0.45*en.f;
      moveEnemy(L,en);
      break;
    }
    case 'mouse': {
      const wx=en.f>0? en.x+en.w+2 : en.x-2;
      const wt={ tx:Math.floor(wx/TILE), ty:Math.floor((en.y+en.h/2)/TILE) };
      const chewing=tlChar(L,wt.tx,wt.ty)==='W';
      if(!chewing){
        const dx=p&&p.x!==undefined? (p.x+p.w/2)-(en.x+en.w/2):0;
        const dy=p? (p.y+p.h/2)-(en.y+en.h/2):0;
        if(p&&!p.dead&&Math.abs(dx)<100&&Math.abs(dy)<40){
          en.f=dx>0?1:-1; en.vx=1.9*en.f;
        } else {
          if(en.turnCd>0) en.turnCd--;
          if((en.blocked||edgeAhead(L,en))&&en.turnCd===0){ en.f*=-1; en.turnCd=40; }
          en.vx=0.5*en.f;
        }
      } else { en.vx=0.3*en.f; en.turnCd=0; }
      if(chewing){
        en.chewTimer=(en.chewTimer||0)+1;
        if(en.chewTimer>=35){ breakWire(L,wt.tx,wt.ty); en.chewTimer=0; }
      } else if(en.chewTimer>0) en.chewTimer=0;
      moveEnemy(L,en);
      break;
    }
    case 'screamer': {
      if(p&&!p.dead){ en.f=(p.x+p.w/2)>(en.x+en.w/2)?1:-1; }
      if(en.turnCd>0) en.turnCd--;
      if(en.blocked&&en.turnCd===0){ en.f*=-1; en.turnCd=50; }
      en.vx=1.7*en.f;
      moveEnemy(L,en);
      if(en.t%4===0) spawnParticles(en.x+en.w/2,en.y+en.h,1,'#a04a2a',{up:0.4});
      break;
    }
    case 'blob': {
      if(en.phase==='swell'){
        en.phaseT++;
        if(en.phaseT>=50){ en.phase='fly'; en.vx=(Math.random()<0.5?-1:1)*1.8; }
      } else {
        if(!en.vx) en.vx=1.8;
        moveEnemy(L,en);
        if(en.onG) en.vy=-4.6;
      }
      // absorbs a drip goblin -> grows, takes 2 hits
      for(let i=L.enemies.length-1;i>=0;i--){
        const o=L.enemies[i];
        if(o!==en&&!o.dead&&o.kind==='goblin'&&rectHit(en,o.x,o.y,o.w,o.h)){
          if(!en.grown){
            o.dead=true; en.grown=true; en.w+=5; en.h+=5; en.y-=5; en.hp=2;
            spawnParticles(o.x+6,o.y+6,10,'#8bd','#4d8dff');
          }
        }
      }
      break;
    }
    case 'miswired': {
      if(en.t%12===0) spawnParticles(en.x+en.w/2,en.y+6,2,'#aef',{up:0.4});
      break;
    }
    case 'crusher': {
      if(en.parked) break;
      en.ct++;
      const cyc=en.ct%200;
      const SEG=[70,30,26,26,26]; let ph=0,acc=0;
      for(let s=0;s<5;s++){ acc+=SEG[s]; if(cyc<acc){ ph=s; break; } }
      en.phase=ph;
      if(ph===2){ en.bx+=1.2*en.dir; if(en.ct%3===0) spawnParticles(en.bx+(en.dir>0?30:0),en.by+8,1,'#5a6472',{up:0.2}); }
      else if(ph===4){ en.bx-=1.2*en.dir; }
      else if(ph===1&&en.ct%8===0) spawnParticles(en.motorX+4,en.motorY+5,1,'#ffd266',{up:0.3});
      break;
    }
    case 'serpent': {
      const cyc=en.t%190;
      en.rise=cyc<95? Math.sin(cyc/95*Math.PI)*35 : 0;
      en.hitbox=en.rise>6? {x:en.x,y:en.baseY-en.rise,w:13,h:en.rise} : null;
      break;
    }
    case 'gascloud': {
      en.life--;
      en.x+=0.35*Math.sin(en.t*0.045+en.seed);
      en.y+=0.3*Math.cos(en.t*0.038+en.seed*2);
      if(en.life<=0) en.dead=true;
      break;
    }
    case 'betty': {
      if(en.t===120) spawnFloatFx('!',en.x+4,en.y-10,'#fd8');
      if(en.t>=240&&!en.popped){
        en.popped=true; en.dead=true;
        const cx=en.x+en.w/2, cy=en.y+10;
        Game.shake=Math.max(Game.shake,7);
        Game.flash=Math.max(Game.flash,0.4);
        spawnParticles(cx,cy,16,'#ffd266',{up:2.2,sp:3});
        AudioEngine.sfx('boom');
        if(p&&!p.dead&&Math.hypot((p.x+p.w/2)-cx,(p.y+p.h/2)-cy)<48) hurtPlayerFn(p,1);
        for(const o of L.enemies){ if(o!==en&&!o.dead&&Math.hypot((o.x+o.w/2)-cx,(o.y+o.h/2)-cy)<48) o.dead=true; }
      }
      break;
    }
    case 'scalper': {
      en.aimT=(en.aimT||0)+1;
      if(en.aimT>=130){
        en.aimT=0;
        const pf=p&&!p.dead? ((p.x+p.w/2)>(en.x+en.w/2)?1:-1) : en.f;
        L.projectiles.push({x:en.x+en.w/2, y:en.y+5, w:5, h:4, vx:2.3*pf, vy:-2.6, grav:true, t:0, life:90, kind:'paper', draw:fn_paperdraw});
        AudioEngine.sfx('paper');
      }
      if(en.x>en.x0+48) en.f=-1;
      if(en.x<en.x0-48) en.f=1;
      en.vx=0.5*en.f;
      moveEnemy(L,en);
      break;
    }
    case 'yak': {
      // plodding cross-lane yak: invulnerable, just keeps walking its patrol
      if(en.x>en.x0+en.rng) en.f=-1;
      if(en.x<en.x0-en.rng) en.f=1;
      en.vx=en.spd*en.f;
      moveEnemy(L,en);
      if(en.onG&&en.t%24===0) spawnParticles(en.x+en.w/2,en.y+en.h,1,'#d8d2c4',{up:0.4});
      break;
    }
    case 'wave': {
      // square-dance dancer: sweeps a fixed line to the rhythm
      const ph=en.t*0.022;
      en.x=en.x0+Math.sin(ph)*en.rng;
      en.y=en.baseY;
      break;
    }
    case 'wraith': {
      if(p&&!p.dead){
        const dx=(p.x+p.w/2)-(en.x+en.w/2), dy=(p.y+p.h/2)-(en.y+en.h/2);
        const d=Math.hypot(dx,dy)||1;
        en.x+=Math.max(-0.4,Math.min(0.4,dx/d*0.32));
        en.y+=Math.max(-0.3,Math.min(0.3,dy/d*0.26));
      } else {
        en.y-=0.15;
      }
      // water-heater steam thaws it (search ±2 tiles)
      const ex=Math.floor((en.x+en.w/2)/TILE), ey=Math.floor((en.y+en.h/2)/TILE);
      thawed:
      for(let oy=-2;oy<=2;oy++)for(let ox=-2;ox<=2;ox++){
        if(tlChar(L,ex+ox,ey+oy)==='h'){
          defeatEnemy(L,en);
          spawnFloatFx('thawed',en.x,en.y-8,'#aef');
          break thawed;
        }
      }
      break;
    }
  }
}
function enemiesUpdate(L,dt){

    updateEnemy(L,en);
    if(en.dead){ L.enemies.splice(i,1); continue; }
    if(en.y>L.h*TILE+80||en.x<-80||en.x>L.w*TILE+80){ L.enemies.splice(i,1); continue; }
    if(p&&!p.dead){
      // crusher motor: stomp or wrench it to park the drawer
      if(en.kind==='crusher'&&!en.parked&&rectHit(p,en.motorX,en.motorY,9,11)){
        if((p.vy>0.3&&(p.y+p.h)-en.motorY<9)||p.swing>0){
          parkCrusher(L,en);
          if(p.vy>0.3&&(p.y+p.h)-en.motorY<9) p.vy=-STOMP_BOUNCE;
        }
      }
      const hr=enRect(en);
      if(hr&&rectHit(p,hr.x,hr.y,hr.w,hr.h)) resolvePlayerTouch(L,en,hr);
    }
  }
}
function resolvePlayerTouch(L,en,hr){
  const p=Game.player;
  if(p.dead) return;
  const stomp=p.vy>0.3&&(p.y+p.h)-hr.y<9;
  if(ENEMY_DEF[en.kind].neutral){
    // invulnerable fauna: no stomp, no wrench — get shoved
    if(en.kind==='yak'){ p.vx=(p.x+p.w/2)<hr.x+hr.w/2? -2.6 : 2.6; p.vy=-2.8; spawnFloatFx('让开 LET THROUGH', p.x-8, p.y-10, '#e8e2d8'); }
    hurtPlayerFn(p,1);
    return;
  }
  switch(en.kind){
    case 'crusher':
      if(en.parked) return;
      killPlayerFn(p,'crush');
      return;
    case 'serpent':
      if(stomp){ popSerpentSeg(L,en); p.vy=-STOMP_BOUNCE; return; }
      hurtPlayerFn(p,1);
      return;
    case 'gascloud':
      hurtPlayerFn(p,1);
      return;
    case 'wraith':
      hurtPlayerFn(p,1);
      wraithFreezeTile(L,en);
      return;
    case 'screamer':
      if(p.slideT>0&&ENEMY_DEF.screamer.slide){ defeatEnemy(L,en); return; }
      hurtPlayerFn(p,1);
      return;
    case 'betty':
      if(stomp&&en.t<120){ defeatEnemy(L,en); p.vy=-STOMP_BOUNCE; return; }
      hurtPlayerFn(p,1);
      return;
  }
  // generic roster
  if(stomp&&ENEMY_DEF[en.kind].stomp){
    defeatEnemy(L,en);
    p.vy=-(p.impact>0? STOMP_BOUNCE*1.25 : STOMP_BOUNCE);
    return;
  }
  if(stomp){ hurtPlayerFn(p,1); return; }
  if(p.slideT>0&&ENEMY_DEF[en.kind].slide){ defeatEnemy(L,en); return; }
  if(en.kind==='miswired'&&p.surge>0){ defeatEnemy(L,en); return; }
  hurtPlayerFn(p,1);
}
function defeatEnemy(L,en){

function hurtPlayerFn(p,dmg){
  if(p.invuln>0||p.surge>0) return;
  if(p.shield){ p.shield=false; p.invuln=60; AudioEngine.sfx('shield'); return; }
  if(Game.power>0){ Game.power--; AudioEngine.sfx('hurt'); p.invuln=90; }
  else { killPlayerFn(p,'hit'); }
}

// boot
function boot(){
  Input.init();
  scaleCanvas();
  Game.state='title';
  requestAnimationFrame(frame);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
