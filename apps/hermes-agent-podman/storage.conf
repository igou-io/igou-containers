# Rootless podman inside a user-namespaced pod: overlay via fuse-overlayfs
# (/dev/fuse injected by the io.kubernetes.cri-o.Devices annotation).
# The [storage] section replaces distro defaults entirely, so root paths are
# restated; rootless podman ignores them and uses $XDG_RUNTIME_DIR and
# $HOME/.local/share/containers (the /opt/data volume in the chart deploy).
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
